<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="HanziPen SC, Hannotate SC, KaiTi, STKaiti, PingFang SC, sans-serif">
  <!-- 背景 -->
  <rect width="400" height="380" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="200" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">内部Demo与演示脚本</text>
  
  <!-- 主流程 -->
  <g transform="translate(50, 60)">
    <!-- 场景选择 -->
    <rect x="0" y="0" width="100" height="40" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
    <text x="50" y="25" text-anchor="middle" font-size="12" fill="#333">选择场景</text>
    
    <!-- 箭头 -->
    <path d="M50 40 L50 55" stroke="#666" stroke-width="1.5" fill="none"/>
    
    <!-- 参数配置 -->
    <rect x="0" y="60" width="100" height="40" rx="4" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
    <text x="50" y="85" text-anchor="middle" font-size="12" fill="#333">参数配置</text>
    
    <!-- 箭头 -->
    <path d="M50 100 L50 115" stroke="#666" stroke-width="1.5" fill="none"/>
    
    <!-- 脚本执行 -->
    <rect x="0" y="120" width="100" height="40" rx="4" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
    <text x="50" y="145" text-anchor="middle" font-size="12" fill="#333">脚本执行</text>
    
    <!-- 分支：录制 vs 直播 -->
    <path d="M50 160 L50 175" stroke="#666" stroke-width="1.5" fill="none"/>
    <path d="M50 175 L-20 175 L-20 200" stroke="#666" stroke-width="1.5" fill="none"/>
    <path d="M-20 200 L-30 195 M-20 200 L-30 205" stroke="#666" stroke-width="1.5"/>
    <path d="M50 175 L120 175 L120 200" stroke="#666" stroke-width="1.5" fill="none"/>
    <path d="M120 200 L110 195 M120 200 L110 205" stroke="#666" stroke-width="1.5"/>
    
    <!-- 录制模式 -->
    <rect x="-70" y="205" width="100" height="40" rx="4" fill="#fce4ec" stroke="#d81b60" stroke-width="1.5"/>
    <text x="-20" y="230" text-anchor="middle" font-size="12" fill="#333">录制模式</text>
    
    <!-- 直播模式 -->
    <rect x="70" y="205" width="100" height="40" rx="4" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/>
    <text x="120" y="230" text-anchor="middle" font-size="12" fill="#333">直播模式</text>
    
    <!-- 录制/直播后箭头到素材输出 -->
    <path d="M-20 245 L-20 260" stroke="#666" stroke-width="1.5" fill="none"/>
    <path d="M120 245 L120 260" stroke="#666" stroke-width="1.5" fill="none"/>
    <path d="M-20 260 L50 260" stroke="#666" stroke-width="1.5" fill="none"/>
    <path d="M120 260 L50 260" stroke="#666" stroke-width="1.5" fill="none"/>
    
    <!-- 素材输出 -->
    <rect x="0" y="265" width="100" height="40" rx="4" fill="#e0f2f1" stroke="#00796b" stroke-width="1.5"/>
    <text x="50" y="290" text-anchor="middle" font-size="12" fill="#333">素材输出</text>
    
    <!-- 箭头 -->
    <path d="M50 305 L50 320" stroke="#666" stroke-width="1.5" fill="none"/>
    
    <!-- 归档 -->
    <rect x="0" y="325" width="100" height="40" rx="4" fill="#f5f5f5" stroke="#757575" stroke-width="1.5"/>
    <text x="50" y="350" text-anchor="middle" font-size="12" fill="#333">归档复用</text>
  </g>
  
  <!-- 输出格式标注 -->
  <g transform="translate(160, 200)">
    <text x="0" y="0" font-size="9" fill="#666">输出格式：</text>
    <text x="0" y="15" font-size="9" fill="#666">视频/截图/PDF/报告</text>
  </g>
</svg>