<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#fffdfa}
      .title{font:700 42px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f1f1f}
      .box{fill:#ffffff;stroke:#2f2f2f;stroke-width:4}
      .safe{fill:#eef8ee;stroke:#2f7d32;stroke-width:4}
      .warn{fill:#fff2f0;stroke:#c62828;stroke-width:4}
      .note{fill:#fff8e8;stroke:#d08b00;stroke-width:4}
      .text{font:700 28px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#1f1f1f}
      .small{font:600 22px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#555}
      .arrow{stroke:#4c78d0;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrowHead)}
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#4c78d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="760"/>
  <text class="title" x="600" y="56" text-anchor="middle">Day04 渠道接入与白名单机制</text>

  <rect class="box" x="60" y="110" width="220" height="84" rx="18"/>
  <text class="text" x="170" y="160" text-anchor="middle">聊天渠道 / API</text>
  <text class="small" x="170" y="188" text-anchor="middle">Telegram、Discord、Webhook</text>

  <rect class="box" x="340" y="110" width="220" height="84" rx="18"/>
  <text class="text" x="450" y="160" text-anchor="middle">消息标准化</text>
  <text class="small" x="450" y="188" text-anchor="middle">统一身份、来源、正文</text>

  <rect class="note" x="620" y="96" width="250" height="112" rx="18"/>
  <text class="text" x="745" y="144" text-anchor="middle">白名单校验</text>
  <text class="small" x="745" y="173" text-anchor="middle">人 / 场 / 事</text>
  <text class="small" x="745" y="198" text-anchor="middle">先判断，再放行</text>

  <rect class="box" x="930" y="110" width="210" height="84" rx="18"/>
  <text class="text" x="1035" y="160" text-anchor="middle">进入会话</text>
  <text class="small" x="1035" y="188" text-anchor="middle">承接上下文与状态</text>

  <path class="arrow" d="M280 152 C300 152, 320 152, 340 152"/>
  <path class="arrow" d="M560 152 C580 152, 600 152, 620 152"/>
  <path class="arrow" d="M870 152 C890 152, 910 152, 930 152"/>

  <rect class="box" x="915" y="290" width="240" height="84" rx="18"/>
  <text class="text" x="1035" y="340" text-anchor="middle">工具执行</text>
  <text class="small" x="1035" y="368" text-anchor="middle">read / exec / browser ...</text>

  <path class="arrow" d="M1035 194 C1035 220, 1035 252, 1035 290"/>

  <rect class="safe" x="720" y="470" width="330" height="92" rx="20"/>
  <text class="text" x="885" y="522" text-anchor="middle">通过：进入执行链路</text>
  <text class="small" x="885" y="551" text-anchor="middle">允许的身份在允许的场景做允许的动作</text>

  <rect class="warn" x="150" y="470" width="330" height="92" rx="20"/>
  <text class="text" x="315" y="522" text-anchor="middle">拒绝：拦截并记录</text>
  <text class="small" x="315" y="551" text-anchor="middle">不满足规则就不进入执行层</text>

  <path class="arrow" d="M745 208 C745 290, 540 360, 315 470"/>
  <path class="arrow" d="M785 208 C820 290, 855 365, 885 470"/>

  <rect class="box" x="240" y="640" width="720" height="70" rx="18"/>
  <text class="text" x="600" y="684" text-anchor="middle">核心原则：入口先治理，执行才可控</text>

  <path class="arrow" d="M315 562 C315 606, 430 624, 520 640"/>
  <path class="arrow" d="M885 562 C885 606, 770 624, 680 640"/>
</svg>