<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
    </marker>
    <style>
      .title { font: 700 28px 'PingFang SC', 'Noto Sans SC', sans-serif; fill:#1f2937; }
      .label { font: 500 18px 'PingFang SC', 'Noto Sans SC', sans-serif; fill:#111827; }
      .small { font: 400 16px 'PingFang SC', 'Noto Sans SC', sans-serif; fill:#374151; }
      .box { fill:#fff; stroke:#2b2b2b; stroke-width:2.5; stroke-linejoin:round; }
      .line { stroke:#2b2b2b; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
      .note { fill:#f9fafb; stroke:#6b7280; stroke-width:2; }
    </style>
  </defs>

  <text x="38" y="48" class="title">Day04 渠道接入与白名单：从消息到可控执行</text>

  <rect x="40" y="90" rx="12" ry="12" width="175" height="86" class="box"/>
  <text x="70" y="125" class="label">渠道消息进入</text>
  <text x="61" y="152" class="small">Telegram / Web / API</text>

  <rect x="260" y="90" rx="12" ry="12" width="175" height="86" class="box"/>
  <text x="298" y="126" class="label">身份识别</text>
  <text x="285" y="152" class="small">用户ID / 会话来源</text>

  <rect x="480" y="90" rx="12" ry="12" width="175" height="86" class="box"/>
  <text x="507" y="126" class="label">白名单校验</text>
  <text x="504" y="152" class="small">账号 / 群组 / 角色</text>

  <rect x="700" y="70" rx="12" ry="12" width="160" height="70" class="box"/>
  <text x="740" y="108" class="label">通过</text>

  <rect x="700" y="158" rx="12" ry="12" width="160" height="70" class="box"/>
  <text x="739" y="196" class="label">拒绝</text>

  <rect x="700" y="285" rx="12" ry="12" width="160" height="88" class="box"/>
  <text x="724" y="321" class="label">执行与回执</text>
  <text x="720" y="348" class="small">工具调用 + 审计日志</text>

  <rect x="40" y="330" rx="12" ry="12" width="615" height="130" class="note"/>
  <text x="62" y="367" class="label">治理要点</text>
  <text x="62" y="398" class="small">1) 白名单先于工具执行，避免“先执行后拦截”</text>
  <text x="62" y="426" class="small">2) 拒绝路径要有可读原因，便于运营和排障</text>

  <path d="M215 133 L260 133" class="line"/>
  <path d="M435 133 L480 133" class="line"/>
  <path d="M655 118 L700 105" class="line"/>
  <path d="M655 148 L700 188" class="line"/>
  <path d="M780 140 L780 285" class="line"/>
  <path d="M780 228 L780 285" class="line"/>
</svg>