<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980">
  <rect width="900" height="980" fill="#fcfbf7"/>
  <style>
    .title { font: 700 30px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#1f2937; }
    .label { font: 600 21px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#1f2937; }
    .text { font: 18px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#374151; }
    .small { font: 16px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#4b5563; }
    .box { fill:#fffefb; stroke:#2f3b4a; stroke-width:3; rx:18; ry:18; }
    .soft { fill:#f8fafc; stroke:#2f3b4a; stroke-width:3; rx:18; ry:18; }
    .warn { fill:#fff7ed; stroke:#9a3412; stroke-width:3; rx:18; ry:18; }
    .ok { fill:#ecfdf5; stroke:#166534; stroke-width:3; rx:18; ry:18; }
    .line { stroke:#2f3b4a; stroke-width:3.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .arrow { marker-end:url(#arrow); }
    .dot { stroke-dasharray:8 10; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#2f3b4a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="54" text-anchor="middle" class="title">Day04 渠道接入与白名单机制</text>

  <rect x="70" y="110" width="180" height="82" class="box"/>
  <text x="160" y="145" text-anchor="middle" class="label">Telegram / Discord</text>
  <text x="160" y="171" text-anchor="middle" class="small">聊天渠道消息</text>

  <rect x="330" y="110" width="240" height="82" class="box"/>
  <text x="450" y="145" text-anchor="middle" class="label">统一消息对象</text>
  <text x="450" y="171" text-anchor="middle" class="small">身份 + 来源 + 正文 + 元数据</text>

  <rect x="650" y="110" width="180" height="82" class="box"/>
  <text x="740" y="145" text-anchor="middle" class="label">Webhook / API</text>
  <text x="740" y="171" text-anchor="middle" class="small">系统回调与外部输入</text>

  <path d="M250 151 C280 151, 290 151, 330 151" class="line arrow"/>
  <path d="M650 151 C620 151, 610 151, 570 151" class="line arrow"/>

  <rect x="250" y="245" width="400" height="96" class="soft"/>
  <text x="450" y="283" text-anchor="middle" class="label">白名单 / 准入判断</text>
  <text x="450" y="312" text-anchor="middle" class="text">人：谁发起</text>
  <text x="450" y="336" text-anchor="middle" class="text">场：在哪个群、线程、域名、渠道</text>

  <path d="M450 192 C450 214, 450 220, 450 245" class="line arrow"/>

  <rect x="125" y="400" width="240" height="104" class="warn"/>
  <text x="245" y="438" text-anchor="middle" class="label">拒绝执行</text>
  <text x="245" y="467" text-anchor="middle" class="text">返回拒绝说明</text>
  <text x="245" y="493" text-anchor="middle" class="small">并记录来源与原因</text>

  <rect x="535" y="400" width="240" height="104" class="ok"/>
  <text x="655" y="438" text-anchor="middle" class="label">进入 Session</text>
  <text x="655" y="467" text-anchor="middle" class="text">承接上下文与目标</text>
  <text x="655" y="493" text-anchor="middle" class="small">准备进入 Agent Loop</text>

  <path d="M410 341 C360 362, 320 378, 290 400" class="line arrow"/>
  <path d="M490 341 C540 362, 580 378, 610 400" class="line arrow"/>

  <rect x="535" y="560" width="240" height="104" class="box"/>
  <text x="655" y="598" text-anchor="middle" class="label">工具执行边界</text>
  <text x="655" y="627" text-anchor="middle" class="text">read / web / cron / message</text>
  <text x="655" y="651" text-anchor="middle" class="small">高风险动作再叠加审批</text>

  <path d="M655 504 C655 526, 655 534, 655 560" class="line arrow"/>

  <rect x="250" y="720" width="400" height="126" class="soft"/>
  <text x="450" y="760" text-anchor="middle" class="label">审计记录</text>
  <text x="450" y="792" text-anchor="middle" class="text">通过、拒绝、失败、回退都要留痕</text>
  <text x="450" y="820" text-anchor="middle" class="small">这样才能复盘规则、优化入口、控制风险</text>

  <path d="M245 504 C245 610, 305 655, 390 720" class="line arrow"/>
  <path d="M655 664 C655 688, 620 700, 560 720" class="line arrow"/>

  <path d="M395 875 C328 910, 242 914, 180 882" class="line line dot"/>
  <text x="178" y="930" class="small">入口规则前置，风险后移更少</text>
</svg>
