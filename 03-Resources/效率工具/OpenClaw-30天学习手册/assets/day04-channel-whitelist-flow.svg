<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1320" viewBox="0 0 960 1320" role="img" aria-labelledby="title desc">
  <title id="title">渠道接入与白名单机制流程图</title>
  <desc id="desc">展示外部渠道进入 OpenClaw 后，经过统一消息、白名单判断、会话承接、Agent Loop、工具执行与审计记录的治理链路。</desc>
  <defs>
    <style>
      .bg { fill: #fffdf8; }
      .title { font: 700 34px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #243042; }
      .sub { font: 500 20px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #5c6675; }
      .label { font: 700 24px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #243042; }
      .small { font: 500 18px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #445064; }
      .tiny { font: 500 16px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #5c6675; }
      .box { fill: #ffffff; stroke: #243042; stroke-width: 3; rx: 22; ry: 22; }
      .soft { fill: #f2f7ff; }
      .gate { fill: #fff5d7; }
      .ok { fill: #ecfbef; }
      .no { fill: #fff0f0; }
      .audit { fill: #f7f2ff; }
      .arrow { fill: none; stroke: #243042; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowHead); }
      .dash { fill: none; stroke: #7c8798; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 7 9; }
      .note { fill: #fff9e8; stroke: #d7a52f; stroke-width: 2.5; rx: 18; ry: 18; }
    </style>
    <marker id="arrowHead" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12" fill="none" stroke="#243042" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="1320"/>

  <text class="title" x="480" y="58" text-anchor="middle">渠道接入与白名单机制</text>
  <text class="sub" x="480" y="92" text-anchor="middle">先统一消息，再判断准入，最后才进入执行链路</text>

  <!-- channels -->
  <rect class="box soft" x="78" y="140" width="210" height="88"/>
  <text class="label" x="183" y="176" text-anchor="middle">聊天渠道</text>
  <text class="tiny" x="183" y="205" text-anchor="middle">Telegram / Discord</text>

  <rect class="box soft" x="375" y="140" width="210" height="88"/>
  <text class="label" x="480" y="176" text-anchor="middle">Webhook</text>
  <text class="tiny" x="480" y="205" text-anchor="middle">系统事件 / 表单</text>

  <rect class="box soft" x="672" y="140" width="210" height="88"/>
  <text class="label" x="777" y="176" text-anchor="middle">网页入口</text>
  <text class="tiny" x="777" y="205" text-anchor="middle">WebChat / 控制台</text>

  <path class="arrow" d="M183 230 C210 278, 330 292, 432 318"/>
  <path class="arrow" d="M480 230 C480 258, 480 284, 480 314"/>
  <path class="arrow" d="M777 230 C738 282, 624 294, 528 318"/>

  <!-- unified message -->
  <rect class="box" x="255" y="320" width="450" height="118"/>
  <text class="label" x="480" y="358" text-anchor="middle">统一消息对象</text>
  <text class="small" x="480" y="391" text-anchor="middle">身份 · 来源 · 正文 · 附件 · 元数据</text>
  <text class="tiny" x="480" y="420" text-anchor="middle">把不同渠道翻译成同一种内部语言</text>

  <path class="arrow" d="M480 440 C480 476, 480 504, 480 536"/>

  <!-- whitelist gate -->
  <rect class="box gate" x="250" y="540" width="460" height="148"/>
  <text class="label" x="480" y="580" text-anchor="middle">白名单 / 准入判断</text>
  <text class="small" x="480" y="616" text-anchor="middle">人：谁可以进来</text>
  <text class="small" x="480" y="647" text-anchor="middle">场：从哪里进来</text>
  <text class="small" x="480" y="678" text-anchor="middle">事：允许做什么</text>

  <!-- pass / reject -->
  <path class="arrow" d="M397 690 C344 734, 300 758, 240 792"/>
  <path class="arrow" d="M563 690 C622 736, 665 760, 722 792"/>

  <rect class="box ok" x="86" y="792" width="308" height="104"/>
  <text class="label" x="240" y="832" text-anchor="middle">通过</text>
  <text class="small" x="240" y="866" text-anchor="middle">进入会话与执行链路</text>

  <rect class="box no" x="566" y="792" width="308" height="104"/>
  <text class="label" x="720" y="832" text-anchor="middle">拒绝</text>
  <text class="small" x="720" y="866" text-anchor="middle">不进入工具调用</text>

  <!-- approved flow -->
  <path class="arrow" d="M240 898 C240 928, 240 950, 240 978"/>
  <rect class="box" x="86" y="980" width="308" height="98"/>
  <text class="label" x="240" y="1018" text-anchor="middle">会话承接</text>
  <text class="small" x="240" y="1050" text-anchor="middle">挂载上下文与任务状态</text>

  <path class="arrow" d="M396 1029 C450 1029, 502 1029, 558 1029"/>
  <rect class="box" x="566" y="980" width="308" height="98"/>
  <text class="label" x="720" y="1018" text-anchor="middle">Agent Loop</text>
  <text class="small" x="720" y="1050" text-anchor="middle">理解意图并规划动作</text>

  <path class="arrow" d="M720 1080 C720 1110, 720 1132, 720 1160"/>
  <rect class="box" x="566" y="1162" width="308" height="98"/>
  <text class="label" x="720" y="1200" text-anchor="middle">工具执行</text>
  <text class="small" x="720" y="1232" text-anchor="middle">读写 / 搜索 / 浏览 / 发送</text>

  <!-- audit -->
  <path class="arrow" d="M720 898 C720 926, 720 938, 720 962"/>
  <path class="arrow" d="M566 1211 C448 1211, 334 1211, 214 1211"/>
  <path class="arrow" d="M240 1078 C240 1112, 216 1140, 196 1162"/>
  <rect class="box audit" x="86" y="1162" width="308" height="98"/>
  <text class="label" x="240" y="1200" text-anchor="middle">审计记录</text>
  <text class="small" x="240" y="1232" text-anchor="middle">通过 · 拒绝 · 失败 · 回退</text>

  <!-- notes -->
  <rect class="note" x="98" y="705" width="270" height="58"/>
  <text class="tiny" x="233" y="729" text-anchor="middle">原则：校验早于执行</text>
  <text class="tiny" x="233" y="751" text-anchor="middle">入口越清晰，风险越可控</text>

  <rect class="note" x="594" y="705" width="270" height="58"/>
  <text class="tiny" x="729" y="729" text-anchor="middle">拒绝也要留痕</text>
  <text class="tiny" x="729" y="751" text-anchor="middle">它是治理优化信号</text>

  <path class="dash" d="M480 115 C480 1280"/>
</svg>
