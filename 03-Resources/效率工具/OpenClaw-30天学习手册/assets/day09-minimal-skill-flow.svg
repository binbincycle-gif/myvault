<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1380" viewBox="0 0 1080 1380">
  <rect width="1080" height="1380" fill="#fffdf8"/>
  <style>
    .title{font:700 36px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif;fill:#2d2a26}
    .sub{font:20px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif;fill:#6b6258}
    .h{font:700 25px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif;fill:#2d2a26}
    .t{font:21px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif;fill:#2d2a26}
    .s{font:18px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif;fill:#5e564d}
    .box{fill:#fffdfa;stroke:#3e372f;stroke-width:3;rx:24;ry:24}
    .accent{fill:#f7efe2;stroke:#3e372f;stroke-width:3;rx:26;ry:26}
    .light{fill:#eef6ff;stroke:#3e372f;stroke-width:3;rx:22;ry:22}
    .green{fill:#eff8ec;stroke:#3e372f;stroke-width:3;rx:22;ry:22}
    .pink{fill:#fff0f4;stroke:#3e372f;stroke-width:3;rx:22;ry:22}
    .line{stroke:#3e372f;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .dash{stroke:#8f8172;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12 10}
  </style>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2,2 L11,7 L2,12" fill="none" stroke="#3e372f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="540" y="74" text-anchor="middle" class="title">Day09｜最小 Skill 从创建到复用</text>
  <text x="540" y="112" text-anchor="middle" class="sub">先把经验写成可触发规则，再逐步增强为组织能力</text>

  <rect x="90" y="155" width="900" height="140" class="accent"/>
  <text x="540" y="203" text-anchor="middle" class="h">选题原则：高频、低风险、格式稳定</text>
  <text x="540" y="242" text-anchor="middle" class="t">日报整理｜会议纪要｜学习资料｜复盘清单</text>
  <text x="540" y="272" text-anchor="middle" class="s">不要第一天就做跨权限、强外部影响、不可回退的任务</text>

  <rect x="110" y="360" width="250" height="118" class="light"/>
  <text x="235" y="405" text-anchor="middle" class="h">① 新建目录</text>
  <text x="235" y="438" text-anchor="middle" class="s">my-first-skill/</text>
  <text x="235" y="464" text-anchor="middle" class="s">名字稳定，便于维护</text>

  <rect x="415" y="360" width="250" height="118" class="green"/>
  <text x="540" y="405" text-anchor="middle" class="h">② 写 SKILL.md</text>
  <text x="540" y="438" text-anchor="middle" class="s">name + description</text>
  <text x="540" y="464" text-anchor="middle" class="s">步骤、格式、边界</text>

  <rect x="720" y="360" width="250" height="118" class="pink"/>
  <text x="845" y="405" text-anchor="middle" class="h">③ 触发试跑</text>
  <text x="845" y="438" text-anchor="middle" class="s">用真实问题验证</text>
  <text x="845" y="464" text-anchor="middle" class="s">观察是否被选中</text>

  <path d="M360 419 C378 412,397 412,415 419" class="line" marker-end="url(#arrow)"/>
  <path d="M665 419 C683 412,702 412,720 419" class="line" marker-end="url(#arrow)"/>

  <rect x="180" y="560" width="720" height="150" class="box"/>
  <text x="540" y="607" text-anchor="middle" class="h">④ 校验最小闭环</text>
  <text x="540" y="646" text-anchor="middle" class="t">能被识别｜能按规则执行｜能稳定产出｜知道不能做什么</text>
  <text x="540" y="681" text-anchor="middle" class="s">如果不稳定，优先修改 description、触发条件、输出结构和风险边界</text>

  <path d="M845 478 C845 530,720 542,625 560" class="line" marker-end="url(#arrow)"/>
  <path d="M455 560 C365 542,235 530,235 478" class="dash" marker-end="url(#arrow)"/>
  <text x="315" y="535" class="s">失败则回改</text>

  <text x="540" y="790" text-anchor="middle" class="h">验证后再增强，不要一开始复杂化</text>

  <rect x="90" y="840" width="190" height="118" class="box"/>
  <text x="185" y="884" text-anchor="middle" class="h">模板型</text>
  <text x="185" y="920" text-anchor="middle" class="s">templates/</text>
  <text x="185" y="946" text-anchor="middle" class="s">固定输出样式</text>

  <rect x="325" y="840" width="190" height="118" class="box"/>
  <text x="420" y="884" text-anchor="middle" class="h">脚本型</text>
  <text x="420" y="920" text-anchor="middle" class="s">scripts/</text>
  <text x="420" y="946" text-anchor="middle" class="s">处理稳定数据</text>

  <rect x="560" y="840" width="190" height="118" class="box"/>
  <text x="655" y="884" text-anchor="middle" class="h">工具型</text>
  <text x="655" y="920" text-anchor="middle" class="s">文件 / 浏览器 / Web</text>
  <text x="655" y="946" text-anchor="middle" class="s">形成执行流程</text>

  <rect x="795" y="840" width="190" height="118" class="box"/>
  <text x="890" y="884" text-anchor="middle" class="h">治理型</text>
  <text x="890" y="920" text-anchor="middle" class="s">审批 / 审计 / 脱敏</text>
  <text x="890" y="946" text-anchor="middle" class="s">进入团队协作</text>

  <path d="M280 899 L325 899" class="line" marker-end="url(#arrow)"/>
  <path d="M515 899 L560 899" class="line" marker-end="url(#arrow)"/>
  <path d="M750 899 L795 899" class="line" marker-end="url(#arrow)"/>

  <rect x="110" y="1050" width="860" height="185" class="accent"/>
  <text x="540" y="1098" text-anchor="middle" class="h">管理视角：Skill 是 AI 时代的 SOP</text>
  <text x="170" y="1147" class="t">提效：少重复解释</text>
  <text x="170" y="1188" class="t">提质：输出结构统一</text>
  <text x="570" y="1147" class="t">提速：从提示词到能力包</text>
  <text x="570" y="1188" class="t">可控：风险边界前置</text>

  <rect x="180" y="1272" width="720" height="56" class="box"/>
  <text x="540" y="1308" text-anchor="middle" class="t">一句话：先跑通最小 Skill，再把验证过的经验沉淀成组织资产</text>
</svg>
