<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" style="font-family: 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; background:#fffdf8;">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="1.2" flood-color="#d8d1c4" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="640" height="760" fill="#fffdf8"/>

  <text x="320" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#2f2f2f">最小 Skill 从创建到复用</text>
  <text x="320" y="66" text-anchor="middle" font-size="13" fill="#777">先跑通闭环，再逐步补模板、脚本和治理规则</text>

  <!-- 主流程节点 -->
  <g filter="url(#softShadow)">
    <rect x="70" y="100" width="500" height="74" rx="16" fill="#eaf4ff" stroke="#3f7fbf" stroke-width="2"/>
    <text x="320" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#2b4d6f">1. 选一个高频低风险任务</text>
    <text x="320" y="154" text-anchor="middle" font-size="13" fill="#4f6272">例如日报整理、会议纪要、学习资料生成</text>

    <rect x="70" y="220" width="500" height="88" rx="16" fill="#fff1df" stroke="#d88b32" stroke-width="2"/>
    <text x="320" y="250" text-anchor="middle" font-size="18" font-weight="700" fill="#6e4316">2. 新建 Skill 目录</text>
    <text x="320" y="274" text-anchor="middle" font-size="13" fill="#70543b">workspace/skills/my-skill/</text>
    <text x="320" y="292" text-anchor="middle" font-size="12" fill="#8a6c50">目录名稳定，便于后续维护和复用</text>

    <rect x="70" y="354" width="500" height="96" rx="16" fill="#eef9ed" stroke="#4c9a57" stroke-width="2"/>
    <text x="320" y="384" text-anchor="middle" font-size="18" font-weight="700" fill="#2d6735">3. 编写 SKILL.md</text>
    <text x="320" y="408" text-anchor="middle" font-size="13" fill="#4c704f">frontmatter：name + description</text>
    <text x="320" y="428" text-anchor="middle" font-size="13" fill="#4c704f">正文：触发场景、步骤、格式、风险边界</text>

    <rect x="70" y="496" width="500" height="86" rx="16" fill="#f5edff" stroke="#8a62c5" stroke-width="2"/>
    <text x="320" y="526" text-anchor="middle" font-size="18" font-weight="700" fill="#563784">4. 让 OpenClaw 加载并试跑</text>
    <text x="320" y="550" text-anchor="middle" font-size="13" fill="#66527b">在真实问题中触发，观察是否按规则输出</text>
    <text x="320" y="568" text-anchor="middle" font-size="12" fill="#7c6b91">失败就改 description 或执行步骤</text>

    <rect x="70" y="628" width="500" height="86" rx="16" fill="#ffeef2" stroke="#c85b78" stroke-width="2"/>
    <text x="320" y="658" text-anchor="middle" font-size="18" font-weight="700" fill="#7d3147">5. 沉淀为可复用 AI SOP</text>
    <text x="320" y="682" text-anchor="middle" font-size="13" fill="#7d4b5a">稳定后再补模板、脚本、审批和审计规则</text>
    <text x="320" y="700" text-anchor="middle" font-size="12" fill="#8d6570">从个人经验升级为组织能力</text>
  </g>

  <!-- 箭头 -->
  <path d="M320 182 C318 194, 318 204, 320 214" stroke="#555" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M320 316 C322 328, 322 340, 320 348" stroke="#555" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M320 458 C318 470, 318 482, 320 490" stroke="#555" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M320 590 C322 602, 322 614, 320 622" stroke="#555" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- 侧边提示 -->
  <g>
    <path d="M44 365 C34 390, 34 430, 48 456" stroke="#b9aa8c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="32" y="414" text-anchor="middle" font-size="12" fill="#8c7a58" transform="rotate(-90 32 414)">最小闭环</text>

    <path d="M596 496 C608 546, 608 648, 596 706" stroke="#b9aa8c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="612" y="604" text-anchor="middle" font-size="12" fill="#8c7a58" transform="rotate(90 612 604)">逐步增强</text>
  </g>

  <!-- 底部小贴士 -->
  <rect x="92" y="728" width="456" height="22" rx="11" fill="#fff7d6" stroke="#e0c45a" stroke-width="1.5"/>
  <text x="320" y="744" text-anchor="middle" font-size="12" fill="#6b5a1c">判断标准：能被识别、能执行、能稳定输出、知道不能做什么</text>
</svg>
