<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <rect width="900" height="620" fill="#fcfbf7"/>
  <style>
    text { font-family: 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#2b2b2b; }
    .title { font-size: 30px; font-weight: 600; }
    .box { fill: #fffdf8; stroke: #3a3a3a; stroke-width: 3; rx: 20; ry: 20; }
    .small { font-size: 20px; }
    .label { font-size: 24px; font-weight: 600; }
    .note { font-size: 18px; fill:#555; }
    .line { stroke:#3a3a3a; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#3a3a3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="50" y="55" class="title">Day24｜环境隔离与 Secrets 管理</text>
  <text x="50" y="90" class="note">把“谁能访问什么、在什么环境里运行、敏感信息怎样流动”拆开治理</text>

  <rect x="55" y="150" width="180" height="110" class="box"/>
  <text x="145" y="195" text-anchor="middle" class="label">开发环境</text>
  <text x="145" y="228" text-anchor="middle" class="small">本地调试</text>
  <text x="145" y="255" text-anchor="middle" class="small">最小样本数据</text>

  <rect x="305" y="150" width="180" height="110" class="box"/>
  <text x="395" y="195" text-anchor="middle" class="label">测试环境</text>
  <text x="395" y="228" text-anchor="middle" class="small">联调验证</text>
  <text x="395" y="255" text-anchor="middle" class="small">权限演练</text>

  <rect x="555" y="150" width="180" height="110" class="box"/>
  <text x="645" y="195" text-anchor="middle" class="label">生产环境</text>
  <text x="645" y="228" text-anchor="middle" class="small">真实业务</text>
  <text x="645" y="255" text-anchor="middle" class="small">审批受控</text>

  <rect x="250" y="350" width="200" height="120" class="box"/>
  <text x="350" y="395" text-anchor="middle" class="label">Secrets 存储层</text>
  <text x="350" y="428" text-anchor="middle" class="small">集中保管</text>
  <text x="350" y="455" text-anchor="middle" class="small">按环境分配</text>

  <rect x="520" y="350" width="250" height="120" class="box"/>
  <text x="645" y="395" text-anchor="middle" class="label">运行时注入与审计</text>
  <text x="645" y="428" text-anchor="middle" class="small">启动时读取</text>
  <text x="645" y="455" text-anchor="middle" class="small">日志脱敏 / 权限留痕</text>

  <path d="M235 205 C260 205, 280 205, 305 205" class="line" marker-end="url(#arrow)"/>
  <path d="M485 205 C510 205, 530 205, 555 205" class="line" marker-end="url(#arrow)"/>
  <path d="M395 260 C395 300, 370 315, 350 350" class="line" marker-end="url(#arrow)"/>
  <path d="M645 260 C645 305, 645 320, 645 350" class="line" marker-end="url(#arrow)"/>
  <path d="M450 410 C475 410, 490 410, 520 410" class="line" marker-end="url(#arrow)"/>

  <text x="70" y="535" class="small">原则 1：环境隔离，避免“测试配置直通生产”</text>
  <text x="70" y="567" class="small">原则 2：密钥不写死在代码、文档、聊天记录里</text>
  <text x="70" y="599" class="small">原则 3：按角色授权，谁调用、何时注入、是否留痕都可追踪</text>
</svg>
