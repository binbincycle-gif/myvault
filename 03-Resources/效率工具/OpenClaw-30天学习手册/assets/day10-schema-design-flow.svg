<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12" fill="none" stroke="#26364f" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0.02 0.04"/>
      </feComponentTransfer>
    </filter>
    <style>
      .bg { fill:#fffdf7; }
      .grain { opacity:0.15; filter:url(#paper); }
      .title { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:34px; fill:#20304a; font-weight:600; }
      .subtitle { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:22px; fill:#526179; }
      .label { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:28px; fill:#20304a; font-weight:600; }
      .small { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:21px; fill:#4d5b73; }
      .tiny { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:18px; fill:#60708a; }
      .box { fill:#fffefa; stroke:#26364f; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .blue { fill:#eef5ff; }
      .green { fill:#eef9f0; }
      .orange { fill:#fff4e2; }
      .red { fill:#fdeef2; }
      .purple { fill:#f2efff; }
      .line { fill:none; stroke:#26364f; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .soft { fill:none; stroke:#6c7a92; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:7 10; marker-end:url(#arrow); }
      .note { fill:#fffefa; stroke:#8b6f2e; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="1200" class="bg"/>
  <rect x="0" y="0" width="900" height="1200" class="grain"/>

  <text x="64" y="74" class="title">Day10｜输入输出 Schema 设计与一致性</text>
  <text x="64" y="112" class="subtitle">核心：先定义接口契约，再让 Agent 稳定调用工具</text>

  <rect x="110" y="155" rx="22" ry="22" width="680" height="92" class="box blue"/>
  <text x="154" y="194" class="label">1. 业务意图</text>
  <text x="154" y="226" class="small">用户说出目标：查资料、建日程、写文件、发通知……</text>

  <path d="M450 247 C450 278,450 291,450 318" class="line"/>

  <rect x="110" y="318" rx="22" ry="22" width="680" height="116" class="box purple"/>
  <text x="154" y="358" class="label">2. input_schema 约束输入</text>
  <text x="154" y="392" class="small">字段名、类型、必填项、枚举、范围、默认值先说清楚</text>
  <text x="154" y="421" class="tiny">让 Agent 知道“能传什么、不能传什么”。</text>

  <path d="M450 434 C450 463,450 479,450 506" class="line"/>

  <rect x="70" y="506" rx="22" ry="22" width="330" height="146" class="box green"/>
  <text x="112" y="548" class="label">3A. 校验通过</text>
  <text x="112" y="584" class="small">参数完整</text>
  <text x="112" y="616" class="small">类型正确</text>
  <text x="112" y="642" class="tiny">进入 handler 执行业务逻辑</text>

  <rect x="500" y="506" rx="22" ry="22" width="330" height="146" class="box red"/>
  <text x="542" y="548" class="label">3B. 校验失败</text>
  <text x="542" y="584" class="small">缺字段 / 越界 / 枚举不符</text>
  <text x="542" y="616" class="small">返回明确错误</text>
  <text x="542" y="642" class="tiny">避免错误进入系统深处</text>

  <path d="M235 652 C235 700,320 721,390 746" class="line"/>
  <path d="M665 652 C665 700,582 721,512 746" class="soft"/>

  <rect x="110" y="746" rx="22" ry="22" width="680" height="112" class="box orange"/>
  <text x="154" y="788" class="label">4. Handler 执行</text>
  <text x="154" y="824" class="small">按已验证参数调用能力；过程可记录、可重试、可排查</text>

  <path d="M450 858 C450 891,450 906,450 934" class="line"/>

  <rect x="110" y="934" rx="22" ry="22" width="680" height="124" class="box blue"/>
  <text x="154" y="976" class="label">5. output_schema 固定输出</text>
  <text x="154" y="1012" class="small">统一返回 success、业务数据、error.code、error.detail</text>
  <text x="154" y="1043" class="tiny">让后续步骤能继续解析，而不是重新猜格式。</text>

  <rect x="110" y="1100" rx="18" ry="18" width="680" height="58" class="note"/>
  <text x="145" y="1137" class="small">管理口诀：输入少歧义，输出可复用；接口越清楚，协作越稳定。</text>
</svg>
