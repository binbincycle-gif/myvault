<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" style="font-family: 'HanziPen SC', 'Hannotate SC', 'KaiTi', 'STKaiti', 'PingFang SC', sans-serif; background: #fafafa;">
  <!-- 背景 -->
  <rect width="600" height="420" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="300" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Schema 设计与验证流程</text>
  
  <!-- 流程节点 -->
  <!-- Step 1: 需求分析 -->
  <rect x="30" y="60" width="100" height="50" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="80" y="80" font-size="13" text-anchor="middle" fill="#333">需求分析</text>
  <text x="80" y="98" font-size="11" text-anchor="middle" fill="#666">确定输入/输出</text>
  
  <!-- Step 2: 定义结构 -->
  <rect x="170" y="60" width="100" height="50" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="220" y="80" font-size="13" text-anchor="middle" fill="#333">定义结构</text>
  <text x="220" y="98" font-size="11" text-anchor="middle" fill="#666">编写 Schema</text>
  
  <!-- Step 3: 编写 Handler -->
  <rect x="310" y="60" width="100" height="50" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="360" y="80" font-size="13" text-anchor="middle" fill="#333">编写 Handler</text>
  <text x="360" y="98" font-size="11" text-anchor="middle" fill="#666">实现业务逻辑</text>
  
  <!-- Step 4: 本地测试 -->
  <rect x="450" y="60" width="100" height="50" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="500" y="80" font-size="13" text-anchor="middle" fill="#333">本地测试</text>
  <text x="500" y="98" font-size="11" text-anchor="middle" fill="#666">验证一致性</text>
  
  <!-- 箭头连接 -->
  <path d="M130 85 L165 85" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M270 85 L305 85" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M410 85 L445 85" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#666"/>
    </marker>
  </defs>
  
  <!-- 左侧详细说明 -->
  <text x="30" y="145" font-size="14" font-weight="bold" fill="#333">input_schema 核心要素</text>
  
  <!-- 输入 Schema 卡片 -->
  <rect x="20" y="160" width="250" height="140" rx="10" fill="#fff" stroke="#90caf9" stroke-width="1.5"/>
  <text x="35" y="185" font-size="12" font-weight="bold" fill="#1976d2">properties</text>
  <text x="35" y="205" font-size="11" fill="#333">• type: 数据类型</text>
  <text x="35" y="222" font-size="11" fill="#333">• description: 字段说明</text>
  <text x="35" y="239" font-size="11" fill="#333">• required: 必填字段</text>
  <text x="35" y="256" font-size="11" fill="#333">• enum: 枚举值限定</text>
  <text x="35" y="273" font-size="11" fill="#333">• default: 默认值</text>
  <text x="35" y="290" font-size="11" fill="#333">• min/max: 范围限制</text>
  
  <!-- 右侧详细说明 -->
  <text x="310" y="145" font-size="14" font-weight="bold" fill="#333">output_schema 核心要素</text>
  
  <!-- 输出 Schema 卡片 -->
  <rect x="300" y="160" width="250" height="140" rx="10" fill="#fff" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="315" y="185" font-size="12" font-weight="bold" fill="#388e3c">返回值设计</text>
  <text x="315" y="205" font-size="11" fill="#333">• 必须返回 success 状态</text>
  <text x="315" y="222" font-size="11" fill="#333">• 成功时返回业务数据</text>
  <text x="315" y="239" font-size="11" fill="#333">• 失败时返回 error 对象</text>
  <text x="315" y="256" font-size="11" fill="#333">• 嵌套对象要定义 properties</text>
  <text x="315" y="273" font-size="11" fill="#333">• 数组要定义 items 类型</text>
  <text x="315" y="290" font-size="11" fill="#333">• 时间用 ISO 8601 格式</text>
  
  <!-- 底部验证流程 -->
  <text x="30" y="335" font-size="14" font-weight="bold" fill="#333">AI 调用时的验证流程</text>
  
  <!-- 验证流程图 -->
  <rect x="30" y="350" width="120" height="40" rx="6" fill="#e1bee7" stroke="#8e24aa" stroke-width="1.5"/>
  <text x="90" y="370" font-size="12" text-anchor="middle" fill="#333">AI 构造参数</text>
  
  <text x="165" y="370" font-size="11" fill="#666">→</text>
  
  <rect x="180" y="350" width="100" height="40" rx="6" fill="#ffccbc" stroke="#d84315" stroke-width="1.5"/>
  <text x="230" y="370" font-size="12" text-anchor="middle" fill="#333">Schema 校验</text>
  
  <text x="295" y="370" font-size="11" fill="#666">→</text>
  
  <rect x="310" y="350" width="80" height="40" rx="6" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="350" y="370" font-size="12" text-anchor="middle" fill="#333">执行 Handler</text>
  
  <text x="405" y="370" font-size="11" fill="#666">→</text>
  
  <rect x="420" y="350" width="100" height="40" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="1.5"/>
  <text x="470" y="370" font-size="12" text-anchor="middle" fill="#333">返回结果</text>
  
  <!-- 底部提示 -->
  <rect x="30" y="400" width="540" height="15" rx="4" fill="#fffde7" stroke="#fbc02d" stroke-width="1"/>
  <text x="300" y="411" font-size="10" text-anchor="middle" fill="#666">⚠ 一致性是关键：Schema 定义 = Handler 返回，两者必须严格匹配</text>
</svg>
