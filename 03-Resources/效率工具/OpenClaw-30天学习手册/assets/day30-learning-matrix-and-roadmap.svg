<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="HanziPen SC, Hannotate SC, KaiTi, STKaiti, PingFang SC, sans-serif" fill="none" stroke="#2c3e50" stroke-linecap="round" stroke-linejoin="round">
