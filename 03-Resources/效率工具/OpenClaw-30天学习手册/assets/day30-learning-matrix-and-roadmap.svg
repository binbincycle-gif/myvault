  <text x="739" y="510" text-anchor="middle" font-size="12" fill="#5d6d7e" stroke="none">写清输入、执行、异常、输出</text>

  <rect x="58" y="548" width="790" height="34" rx="10" fill="#fff7dc" stroke="#d9a441" stroke-width="1.6"/>
  <text x="453" y="570" text-anchor="middle" font-size="13" fill="#6b5b2a" stroke="none">一句话：30天学习要落成模板、Skill 与治理规则，才能从“会用”升级成“能持续产出”。</text>
