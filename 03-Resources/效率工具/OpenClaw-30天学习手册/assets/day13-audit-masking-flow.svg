<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" style="font-family: 'HanziPen SC', 'Hannotate SC', 'KaiTi', 'STKaiti', 'PingFang SC', sans-serif;">
  <!-- 审计与脱敏流程 -->
  <rect x="10" y="10" width="380" height="300" fill="#fafafa" stroke="#333" stroke-width="2" rx="8"/>
  
  <!-- 标题 -->
  <text x="200" y="40" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">审计与脱敏处理流程</text>
  
  <!-- 输入节点 -->
  <rect x="30" y="70" width="100" height="40" fill="#fff" stroke="#2563eb" stroke-width="2" rx="4"/>
  <text x="80" y="95" text-anchor="middle" font-size="12" fill="#333">原始数据输入</text>
  
  <!-- 审计节点 -->
  <rect x="150" y="70" width="100" height="40" fill="#fff" stroke="#7c3aed" stroke-width="2" rx="4"/>
  <text x="200" y="95" text-anchor="middle" font-size="12" fill="#333">审计事件采集</text>
  
  <!-- 脱敏规则节点 -->
  <rect x="270" y="70" width="100" height="40" fill="#fff" stroke="#059669" stroke-width="2" rx="4"/>
  <text x="320" y="95" text-anchor="middle" font-size="12" fill="#333">脱敏规则匹配</text>
  
  <!-- 箭头1 -->
  <path d="M130 90 L150 90" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 箭头2 -->
  <path d="M250 90 L270 90" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 处理节点 -->
  <rect x="30" y="150" width="100" height="40" fill="#fff" stroke="#2563eb" stroke-width="2" rx="4"/>
  <text x="80" y="175" text-anchor="middle" font-size="12" fill="#333">日志写入</text>
  
  <!-- 存储节点 -->
  <rect x="150" y="150" width="100" height="40" fill="#fff" stroke="#7c3aed" stroke-width="2" rx="4"/>
  <text x="200" y="175" text-anchor="middle" font-size="12" fill="#333">安全存储</text>
  
  <!-- 脱敏执行节点 -->
  <rect x="270" y="150" width="100" height="40" fill="#fff" stroke="#059669" stroke-width="2" rx="4"/>
  <text x="320" y="175" text-anchor="middle" font-size="12" fill="#333">数据脱敏处理</text>
  
  <!-- 箭头3 -->
  <path d="M130 170 L150 170" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 箭头4 -->
  <path d="M250 170 L270 170" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 输出1 -->
  <rect x="30" y="230" width="100" height="40" fill="#fff" stroke="#7c3aed" stroke-width="2" rx="4"/>
  <text x="80" y="255" text-anchor="middle" font-size="12" fill="#333">审计日志</text>
  
  <!-- 输出2 -->
  <rect x="150" y="230" width="100" height="40" fill="#fff" stroke="#059669" stroke-width="2" rx="4"/>
  <text x="200" y="255" text-anchor="middle" font-size="12" fill="#333">脱敏后数据</text>
  
  <!-- 查询节点 -->
  <rect x="270" y="230" width="100" height="40" fill="#fff" stroke="#dc2626" stroke-width="2" rx="4"/>
  <text x="320" y="255" text-anchor="middle" font-size="12" fill="#333">合规查询</text>
  
  <!-- 箭头5 -->
  <path d="M80 210 L80 230" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M200 190 L200 210 L200 230" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M320 210 L320 230" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 图例 -->
  <rect x="30" y="285" width="12" height="12" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="48" y="295" font-size="10" fill="#333">审计</text>
  <rect x="90" y="285" width="12" height="12" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text x="108" y="295" font-size="10" fill="#333">脱敏</text>
  
  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>