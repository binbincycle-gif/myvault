<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4A5568"/>
    </marker>
  </defs>
  
  <!-- 标题 -->
  <text x="400" y="30" font-family="PingFang SC, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2D3748">Week3 自动化闭环验收流程</text>
  
  <!-- 主流程 - 圆角矩形风格 -->
  
  <!-- 第一行：触发与准备 -->
  <rect x="50" y="70" width="120" height="50" rx="8" fill="#E6FFFA" stroke="#319795" stroke-width="2"/>
  <text x="110" y="100" font-family="PingFang SC, sans-serif" font-size="13" text-anchor="middle" fill="#2D3748">1. 触发源</text>
  <text x="110" y="118" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">定时/手动/API</text>
  
  <line x1="170" y1="95" x2="210" y2="95" stroke="#4A5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="210" y="70" width="120" height="50" rx="8" fill="#E6FFFA" stroke="#319795" stroke-width="2"/>
  <text x="270" y="100" font-family="PingFang SC, sans-serif" font-size="13" text-anchor="middle" fill="#2D3748">2. 任务解析</text>
  <text x="270" y="118" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">输入校验/拆分</text>
  
  <!-- 第二行：Browser 执行 -->
  <line x1="330" y1="95" x2="370" y2="95" stroke="#4A5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="370" y="70" width="120" height="50" rx="8" fill="#FEEBC8" stroke="#DD6B20" stroke-width="2"/>
  <text x="430" y="100" font-family="PingFang SC, sans-serif" font-size="13" text-anchor="middle" fill="#2D3748">3. Browser 执行</text>
  <text x="430" y="118" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">页面加载/交互</text>
  
  <line x1="490" y1="95" x2="530" y2="95" stroke="#4A5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="530" y="70" width="120" height="50" rx="8" fill="#FED7D7" stroke="#C53030" stroke-width="2"/>
  <text x="590" y="100" font-family="PingFang SC, sans-serif" font-size="13" text-anchor="middle" fill="#2D3748">4. 数据提取</text>
  <text x="590" y="118" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">DOM解析/结构化</text>
  
  <!-- 第三行：验证与处理 -->
  <line x1="590" y1="120" x2="590" y2="180" stroke="#4A5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="530" y="180" width="120" height="50" rx="8" fill="#C6F6D5" stroke="#38A169" stroke-width="2"/>
  <text x="590" y="210" font-family="PingFang SC, sans-serif" font-size="13" text-anchor="middle" fill="#2D3748">5. 结果校验</text>
  <text x="590" y="228" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">Schema/业务规则</text>
  
  <!-- 决策分支 -->
  <line x1="530" y1="205" x2="490" y2="205" stroke="#4A5568" stroke-width="2"/>
  <text x="510" y="195" font-family="PingFang SC, sans-serif" font-size="10" text-anchor="middle" fill="#C53030">不通过</text>
  
  <line x1="490" y1="205" x2="430" y2="205" stroke="#4A5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="370" y="180" width="120" height="50" rx="8" fill="#FED7E2" stroke="#B83280" stroke-width="2"/>
  <text x="430" y="210" font-family="PingFang SC, sans-serif" font-size="13" text-anchor="middle" fill="#2D3748">6. 异常处理</text>
  <text x="430" y="228" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">重试/降级/告警</text>
  
  <line x1="370" y1="205" x2="330" y2="205" stroke="#4A5568" stroke-width="2"/>
  <line x1="330" y1="205" x2="330" y2="120" stroke="#4A5568" stroke-width="2"/>
  <line x1="330" y1="120" x2="370" y2="120" stroke="#4A5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- 通过分支 -->
  <line x1="650" y1="205" x2="690" y2="205" stroke="#4A5568" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <rect x="690" y="180" width="120" height="50" rx="8" fill="#BEE3F8" stroke="#2B6CB0" stroke-width="2"/>
  <text x="750" y="210" font-family="PingFang SC, sans-serif" font-size="13" text-anchor="middle" fill="#2D3748">7. 数据交付</text>
  <text x="750" y="228" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">存储/推送/报表</text>
  
  <!-- 右侧：可观测性 -->
  <rect x="50" y="300" width="160" height="180" rx="8" fill="#EDF2F7" stroke="#718096" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="130" y="325" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2D3748">全程可观测</text>
  <text x="130" y="350" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">• 执行日志</text>
  <text x="130" y="370" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">• 步骤截图</text>
  <text x="130" y="390" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">• 状态记录</text>
  <text x="130" y="410" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">• 耗时统计</text>
  <text x="130" y="430" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">• 成本追踪</text>
  <text x="130" y="450" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">• 异常告警</text>
  
  <!-- 右侧：闭环要点 -->
  <rect x="230" y="300" width="160" height="180" rx="8" fill="#EDF2F7" stroke="#718096" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="310" y="325" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2D3748">闭环四要素</text>
  <text x="310" y="355" font-family="PingFang SC, sans-serif" font-size="12" text-anchor="middle" fill="#319795">1. 可观测</text>
  <text x="310" y="380" font-family="PingFang SC, sans-serif" font-size="12" text-anchor="middle" fill="#DD6B20">2. 可重试</text>
  <text x="310" y="405" font-family="PingFang SC, sans-serif" font-size="12" text-anchor="middle" fill="#38A169">3. 可追溯</text>
  <text x="310" y="430" font-family="PingFang SC, sans-serif" font-size="12" text-anchor="middle" fill="#2B6CB0">4. 可度量</text>
  
  <!-- 右侧：核心指标 -->
  <rect x="410" y="300" width="160" height="180" rx="8" fill="#EDF2F7" stroke="#718096" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="490" y="325" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2D3748">核心指标</text>
  <text x="490" y="355" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">成功率 ≥ 95%</text>
  <text x="490" y="380" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">耗时 ≤ 人工20%</text>
  <text x="490" y="405" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">成本预警阈值</text>
  <text x="490" y="430" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">日累计 ≤ ¥100</text>
  <text x="490" y="455" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#4A5568">单任务 ≤ ¥5</text>
  
  <!-- 右侧：治理手段 -->
  <rect x="590" y="300" width="160" height="180" rx="8" fill="#EDF2F7" stroke="#718096" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="670" y="325" font-family="PingFang SC, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#2D3748">治理手段</text>
  <text x="670" y="355" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#C53030">• 变更检测</text>
  <text x="670" y="380" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#C53030">• 熔断机制</text>
  <text x="670" y="405" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#C53030">• 审计日志</text>
  <text x="670" y="430" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#C53030">• 脱敏处理</text>
  <text x="670" y="455" font-family="PingFang SC, sans-serif" font-size="11" text-anchor="middle" fill="#C53030">• 权限控制</text>
  
  <!-- 底部：Week3 总结 -->
  <rect x="50" y="520" width="700" height="50" rx="8" fill="#FAF5FF" stroke="#805AD5" stroke-width="2"/>
  <text x="400" y="545" font-family="PingFang SC, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2D3748">Week3 核心价值：从"能跑"到"可交付"</text>
  <text x="400" y="565" font-family="PingFang SC, sans-serif" font-size="12" text-anchor="middle" fill="#4A5568">自动化 → 工程化 → 可治理</text>
</svg>
