<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#2F4858" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .txt{font-family:"HanziPen SC","Hannotate SC","KaiTi","STKaiti","PingFang SC",sans-serif;fill:#1F2937}
      .title{font-size:28px;font-weight:700}
      .label{font-size:22px;font-weight:600}
      .small{font-size:18px}
      .box{fill:#FFFDF7;stroke:#2F4858;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .flow{fill:none;stroke:#2F4858;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .back{fill:none;stroke:#5B6C7A;stroke-width:2.5;stroke-dasharray:8 8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
