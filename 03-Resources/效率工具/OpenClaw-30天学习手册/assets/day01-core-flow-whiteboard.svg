<svg width="1400" height="680" viewBox="0 0 1400 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#fffdfa}
      .t{font:700 44px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif;fill:#111}
      .s{font:600 30px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif;fill:#111}
      .sub{font:500 24px 'PingFang SC','Microsoft YaHei',sans-serif;fill:#333}
      .box{fill:#fff;stroke:#111;stroke-width:5;rx:18;ry:18}
      .diamond{fill:#fff;stroke:#111;stroke-width:5}
      .arr{stroke:#3b6fd0;stroke-width:5;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}
      .tag{fill:#eef4ff;stroke:#6b8ff2;stroke-width:3;rx:14;ry:14}
    </style>
    <marker id="a" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth" viewBox="0 0 6 6">
      <path d="M0.6,0.6 L5.2,3 L0.6,5.4" fill="none" stroke="#3b6fd0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="680"/>
  <text class="t" x="700" y="70" text-anchor="middle">核心链路</text>

  <rect class="box" x="70" y="250" width="170" height="90"/>
  <text class="s" x="155" y="305" text-anchor="middle">用户消息</text>

  <rect class="box" x="300" y="250" width="180" height="90"/>
  <text class="s" x="390" y="305" text-anchor="middle">Channel接入</text>

  <rect class="box" x="540" y="250" width="190" height="90"/>
  <text class="s" x="635" y="305" text-anchor="middle">Agent解析意图</text>

  <polygon class="diamond" points="900,220 1040,295 900,370 760,295"/>
  <text class="s" x="900" y="305" text-anchor="middle">需要工具？</text>

  <rect class="box" x="1040" y="130" width="170" height="90"/>
  <text class="s" x="1125" y="185" text-anchor="middle">直接回复</text>

  <rect class="box" x="1040" y="360" width="200" height="90"/>
  <text class="s" x="1140" y="415" text-anchor="middle">调用工具</text>

  <rect class="box" x="1260" y="360" width="120" height="90"/>
  <text class="s" x="1320" y="415" text-anchor="middle">汇总</text>

  <rect class="box" x="1040" y="520" width="170" height="90"/>
  <text class="s" x="1125" y="575" text-anchor="middle">结构化输出</text>

  <rect class="box" x="780" y="520" width="180" height="90"/>
  <text class="s" x="870" y="575" text-anchor="middle">回传用户</text>

  <rect class="tag" x="520" y="520" width="210" height="90"/>
  <text class="s" x="625" y="575" text-anchor="middle">状态/日志记录</text>

  <path class="arr" d="M240,295 L300,295"/>
  <path class="arr" d="M480,295 L540,295"/>
  <path class="arr" d="M730,295 L760,295"/>
  <path class="arr" d="M1040,270 C1055,250 1038,220 1040,185"/>
  <path class="arr" d="M1040,320 C1055,345 1030,372 1040,405"/>
  <path class="arr" d="M1240,405 L1260,405"/>
  <path class="arr" d="M1320,450 C1320,500 1220,540 1210,560"/>
  <path class="arr" d="M1040,565 L960,565"/>
  <path class="arr" d="M780,565 L730,565"/>

  <text class="sub" x="980" y="245">否</text>
  <text class="sub" x="1015" y="355">是</text>
</svg>