<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1180" viewBox="0 0 960 1180">
  <defs>
    <style>
      .t{font-family:"HanziPen SC","Hannotate SC","KaiTi","STKaiti","PingFang SC",sans-serif;fill:#1f2937}
      .title{font-size:32px;font-weight:700}
      .h{font-size:22px;font-weight:700}
      .b{font-size:18px}
      .s{font-size:16px}
      .box{fill:#fffdf7;stroke:#1f2937;stroke-width:3;rx:18;ry:18}
      .soft{fill:#f8fbff;stroke:#1f2937;stroke-width:3;rx:18;ry:18}
      .pill{fill:#eef6ff;stroke:#1f2937;stroke-width:2.5;rx:22;ry:22}
      .arr{fill:none;stroke:#1f2937;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .dot{stroke-dasharray:8 8}
    </style>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#1f2937" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="480" y="52" text-anchor="middle" class="t title">OpenClaw 第一周：从会用到能跑</text>
  <text x="480" y="86" text-anchor="middle" class="t b">把 6 个知识点串成一条“可执行、可治理、可复盘”的最小闭环</text>

  <rect x="48" y="126" width="864" height="190" class="box"/>
  <text x="80" y="162" class="t h">第一周知识地图</text>

  <rect x="78" y="192" width="118" height="78" class="pill"/>
  <text x="137" y="225" text-anchor="middle" class="t b">Day01</text>
  <text x="137" y="252" text-anchor="middle" class="t s">全景认知</text>

  <rect x="216" y="192" width="118" height="78" class="pill"/>
  <text x="275" y="225" text-anchor="middle" class="t b">Day02</text>
  <text x="275" y="252" text-anchor="middle" class="t s">架构分层</text>

  <rect x="354" y="192" width="118" height="78" class="pill"/>
  <text x="413" y="225" text-anchor="middle" class="t b">Day03</text>
  <text x="413" y="252" text-anchor="middle" class="t s">本地闭环</text>

  <rect x="492" y="192" width="118" height="78" class="pill"/>
  <text x="551" y="225" text-anchor="middle" class="t b">Day04</text>
  <text x="551" y="252" text-anchor="middle" class="t s">渠道接入</text>

  <rect x="630" y="192" width="118" height="78" class="pill"/>
  <text x="689" y="225" text-anchor="middle" class="t b">Day05</text>
  <text x="689" y="252" text-anchor="middle" class="t s">执行边界</text>

  <rect x="768" y="192" width="118" height="78" class="pill"/>
  <text x="827" y="225" text-anchor="middle" class="t b">Day06</text>
  <text x="827" y="252" text-anchor="middle" class="t s">可观测性</text>

  <path d="M196 231 C205 226, 208 226, 216 231" class="arr" marker-end="url(#arrow)"/>
  <path d="M334 231 C343 226, 346 226, 354 231" class="arr" marker-end="url(#arrow)"/>
  <path d="M472 231 C481 226, 484 226, 492 231" class="arr" marker-end="url(#arrow)"/>
  <path d="M610 231 C619 226, 622 226, 630 231" class="arr" marker-end="url(#arrow)"/>
  <path d="M748 231 C757 226, 760 226, 768 231" class="arr" marker-end="url(#arrow)"/>

  <rect x="48" y="356" width="864" height="520" class="soft"/>
  <text x="80" y="392" class="t h">最小执行闭环</text>

  <rect x="92" y="438" width="180" height="96" class="box"/>
  <text x="182" y="476" text-anchor="middle" class="t b">1. 接收请求</text>
  <text x="182" y="504" text-anchor="middle" class="t s">聊天 / 主会话 / 定时任务</text>

  <rect x="390" y="438" width="180" height="96" class="box"/>
  <text x="480" y="476" text-anchor="middle" class="t b">2. 理解与决策</text>
  <text x="480" y="504" text-anchor="middle" class="t s">判断直接答复还是调工具</text>

  <rect x="688" y="438" width="180" height="96" class="box"/>
  <text x="778" y="476" text-anchor="middle" class="t b">3. 执行动作</text>
  <text x="778" y="504" text-anchor="middle" class="t s">读文件 / 跑命令 / 抓网页</text>

  <rect x="92" y="650" width="180" height="96" class="box"/>
  <text x="182" y="688" text-anchor="middle" class="t b">4. 安全约束</text>
  <text x="182" y="716" text-anchor="middle" class="t s">白名单 / 审批 / 权限边界</text>

  <rect x="390" y="650" width="180" height="96" class="box"/>
  <text x="480" y="688" text-anchor="middle" class="t b">5. 记录状态</text>
  <text x="480" y="716" text-anchor="middle" class="t s">日志 / 耗时 / 失败信息</text>

  <rect x="688" y="650" width="180" height="96" class="box"/>
  <text x="778" y="688" text-anchor="middle" class="t b">6. 回传结果</text>
  <text x="778" y="716" text-anchor="middle" class="t s">结果交付 + 过程可复盘</text>

  <path d="M272 486 C322 486, 340 486, 390 486" class="arr" marker-end="url(#arrow)"/>
  <path d="M570 486 C620 486, 638 486, 688 486" class="arr" marker-end="url(#arrow)"/>
  <path d="M778 534 C778 580, 778 600, 778 650" class="arr" marker-end="url(#arrow)"/>
  <path d="M688 698 C638 698, 620 698, 570 698" class="arr" marker-end="url(#arrow)"/>
  <path d="M390 698 C340 698, 322 698, 272 698" class="arr" marker-end="url(#arrow)"/>
  <path d="M182 650 C182 604, 182 584, 182 534" class="arr" marker-end="url(#arrow)"/>

  <path d="M272 478 C310 440, 338 422, 390 402" class="arr dot" marker-end="url(#arrow)"/>
  <text x="316" y="426" class="t s">理解不是一次猜对</text>

  <path d="M688 728 C648 776, 596 806, 520 828" class="arr dot" marker-end="url(#arrow)"/>
  <text x="598" y="806" class="t s">结果要能回溯到过程</text>

  <rect x="48" y="918" width="864" height="196" class="box"/>
  <text x="80" y="954" class="t h">管理者真正关心的 3 个结果</text>

  <rect x="92" y="992" width="220" height="84" class="pill"/>
  <text x="202" y="1027" text-anchor="middle" class="t b">能落地</text>
  <text x="202" y="1055" text-anchor="middle" class="t s">不是 PPT，而是能跑通</text>

  <rect x="370" y="992" width="220" height="84" class="pill"/>
  <text x="480" y="1027" text-anchor="middle" class="t b">能控风险</text>
  <text x="480" y="1055" text-anchor="middle" class="t s">自动化不越权、不失控</text>

  <rect x="648" y="992" width="220" height="84" class="pill"/>
  <text x="758" y="1027" text-anchor="middle" class="t b">能复盘</text>
  <text x="758" y="1055" text-anchor="middle" class="t s">失败能定位，成功能复用</text>
</svg>