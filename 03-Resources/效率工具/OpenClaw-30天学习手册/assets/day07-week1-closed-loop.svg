<svg width="960" height="620" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font: 700 30px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#1f2937; }
      .label { font: 600 22px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#111827; }
      .small { font: 500 18px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#374151; }
      .box { fill:#ffffff; stroke:#111827; stroke-width:3; rx:14; ry:14; }
      .line { stroke:#111827; stroke-width:3.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827" />
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="620" fill="#fffdf8" />
  <text x="40" y="56" class="title">OpenClaw 第1周能力闭环（Day01-06）</text>

  <rect class="box" x="60" y="110" width="240" height="96" />
  <text x="88" y="152" class="label">认知框架</text>
  <text x="88" y="182" class="small">Day01-02：架构与消息流</text>

  <rect class="box" x="360" y="110" width="240" height="96" />
  <text x="388" y="152" class="label">最小闭环</text>
  <text x="388" y="182" class="small">Day03：本地启动与验证</text>

  <rect class="box" x="660" y="110" width="240" height="96" />
  <text x="688" y="152" class="label">接入治理</text>
  <text x="688" y="182" class="small">Day04：渠道与白名单</text>

  <rect class="box" x="210" y="330" width="240" height="96" />
  <text x="238" y="372" class="label">执行边界</text>
  <text x="238" y="402" class="small">Day05：Shell能力与风控</text>

  <rect class="box" x="510" y="330" width="240" height="96" />
  <text x="538" y="372" class="label">可观测性</text>
  <text x="538" y="402" class="small">Day06：日志、状态、追踪</text>

  <rect class="box" x="330" y="500" width="300" height="84" />
  <text x="358" y="546" class="label">可复制运营闭环</text>

  <path class="line" d="M300 158 L360 158" marker-end="url(#arrow)" />
  <path class="line" d="M600 158 L660 158" marker-end="url(#arrow)" />

  <path class="line" d="M780 206 C780 250, 680 260, 620 320" marker-end="url(#arrow)" />
  <path class="line" d="M360 206 C320 250, 300 260, 270 320" marker-end="url(#arrow)" />

  <path class="line" d="M450 378 L510 378" marker-end="url(#arrow)" />

  <path class="line" d="M330 426 C330 462, 360 474, 420 500" marker-end="url(#arrow)" />
  <path class="line" d="M630 426 C630 462, 600 474, 540 500" marker-end="url(#arrow)" />

  <text x="64" y="592" class="small">读图顺序：上排打基础 → 中排定边界与观测 → 下排形成可持续迭代能力</text>
</svg>