<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1280" viewBox="0 0 920 1280">
  <defs>
    <style>
      .bg { fill: #fcfbf7; }
      .title { font: 700 32px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill: #24323d; }
      .section { font: 700 24px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill: #31424f; }
      .label { font: 600 20px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill: #24323d; }
      .small { font: 500 17px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill: #425766; }
      .box { fill: #fffdf8; stroke: #31424f; stroke-width: 3; rx: 18; ry: 18; }
      .line { stroke: #31424f; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke-dasharray: 8 10; }
      .accent1 { fill: #eef6ff; }
      .accent2 { fill: #eef8f1; }
      .accent3 { fill: #fff5e8; }
      .accent4 { fill: #f7efff; }
      .accent5 { fill: #fff0f0; }
      .accent6 { fill: #eff7f7; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#31424f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="920" height="1280"/>
  <text class="title" x="460" y="58" text-anchor="middle">Day07 · Week1 最小闭环复盘</text>
  <text class="small" x="460" y="92" text-anchor="middle">从会用到能跑，再到可控、可查、可扩展</text>

  <text class="section" x="64" y="142">一、第一周 6 个学习模块</text>

  <rect class="box accent1" x="60" y="170" width="240" height="116"/>
  <text class="label" x="180" y="205" text-anchor="middle">Day01 全景认知</text>
  <text class="small" x="180" y="238" text-anchor="middle">先建立执行系统视角</text>
  <text class="small" x="180" y="264" text-anchor="middle">不是聊天能力堆叠</text>

  <rect class="box accent2" x="340" y="170" width="240" height="116"/>
  <text class="label" x="460" y="205" text-anchor="middle">Day02 架构分层</text>
  <text class="small" x="460" y="238" text-anchor="middle">交互、决策、执行、治理</text>
  <text class="small" x="460" y="264" text-anchor="middle">知道职责怎么拆</text>

  <rect class="box accent3" x="620" y="170" width="240" height="116"/>
  <text class="label" x="740" y="205" text-anchor="middle">Day03 本地闭环</text>
  <text class="small" x="740" y="238" text-anchor="middle">从输入跑到结果</text>
  <text class="small" x="740" y="264" text-anchor="middle">验证能不能真的跑</text>

  <rect class="box accent4" x="60" y="320" width="240" height="116"/>
  <text class="label" x="180" y="355" text-anchor="middle">Day04 渠道接入</text>
  <text class="small" x="180" y="388" text-anchor="middle">谁可以触发系统</text>
  <text class="small" x="180" y="414" text-anchor="middle">入口边界先管住</text>

  <rect class="box accent5" x="340" y="320" width="240" height="116"/>
  <text class="label" x="460" y="355" text-anchor="middle">Day05 执行安全</text>
  <text class="small" x="460" y="388" text-anchor="middle">Shell 边界、审批、限制</text>
  <text class="small" x="460" y="414" text-anchor="middle">防止能力失控</text>

  <rect class="box accent6" x="620" y="320" width="240" height="116"/>
  <text class="label" x="740" y="355" text-anchor="middle">Day06 可观测性</text>
  <text class="small" x="740" y="388" text-anchor="middle">日志、状态、追踪</text>
  <text class="small" x="740" y="414" text-anchor="middle">问题能查、能复盘</text>

  <path class="line" marker-end="url(#arrow)" d="M300 228 C320 228, 320 228, 340 228"/>
  <path class="line" marker-end="url(#arrow)" d="M580 228 C600 228, 600 228, 620 228"/>
  <path class="line" marker-end="url(#arrow)" d="M180 286 C180 302, 180 304, 180 320"/>
  <path class="line" marker-end="url(#arrow)" d="M460 286 C460 302, 460 304, 460 320"/>
  <path class="line" marker-end="url(#arrow)" d="M740 286 C740 302, 740 304, 740 320"/>
  <path class="line" marker-end="url(#arrow)" d="M300 378 C320 378, 320 378, 340 378"/>
  <path class="line" marker-end="url(#arrow)" d="M580 378 C600 378, 600 378, 620 378"/>

  <text class="section" x="64" y="500">二、最小执行闭环</text>

  <rect class="box accent1" x="80" y="540" width="160" height="90"/>
  <text class="label" x="160" y="575" text-anchor="middle">接收请求</text>
  <text class="small" x="160" y="604" text-anchor="middle">渠道 + Session</text>

  <rect class="box accent2" x="290" y="540" width="160" height="90"/>
  <text class="label" x="370" y="575" text-anchor="middle">理解目标</text>
  <text class="small" x="370" y="604" text-anchor="middle">Agent 做判断</text>

  <rect class="box accent3" x="500" y="540" width="160" height="90"/>
  <text class="label" x="580" y="575" text-anchor="middle">执行动作</text>
  <text class="small" x="580" y="604" text-anchor="middle">工具真正落地</text>

  <rect class="box accent4" x="710" y="540" width="160" height="90"/>
  <text class="label" x="790" y="575" text-anchor="middle">返回结果</text>
  <text class="small" x="790" y="604" text-anchor="middle">输出给用户</text>

  <path class="line" marker-end="url(#arrow)" d="M240 585 C258 585, 270 585, 290 585"/>
  <path class="line" marker-end="url(#arrow)" d="M450 585 C468 585, 480 585, 500 585"/>
  <path class="line" marker-end="url(#arrow)" d="M660 585 C678 585, 690 585, 710 585"/>

  <rect class="box" x="220" y="690" width="480" height="116"/>
  <text class="label" x="460" y="727" text-anchor="middle">治理与观测始终在旁路护航</text>
  <text class="small" x="460" y="760" text-anchor="middle">白名单、审批、执行边界、日志、状态、失败定位</text>
  <text class="small" x="460" y="790" text-anchor="middle">它们不直接产出结果，却决定这套系统能不能进入真实协作</text>

  <path class="line dash" marker-end="url(#arrow)" d="M160 630 C160 664, 250 674, 310 690"/>
  <path class="line dash" marker-end="url(#arrow)" d="M370 630 C370 664, 390 674, 420 690"/>
  <path class="line dash" marker-end="url(#arrow)" d="M580 630 C580 664, 530 674, 500 690"/>
  <path class="line dash" marker-end="url(#arrow)" d="M790 630 C790 664, 670 674, 610 690"/>

  <text class="section" x="64" y="884">三、管理者真正该看到什么</text>

  <rect class="box accent3" x="80" y="920" width="230" height="170"/>
  <text class="label" x="195" y="960" text-anchor="middle">不是看 AI 炫技</text>
  <text class="small" x="195" y="995" text-anchor="middle">而是看任务能否稳定落地</text>
  <text class="small" x="195" y="1024" text-anchor="middle">从需求到结果是否可解释</text>
  <text class="small" x="195" y="1053" text-anchor="middle">后续是否能规模复用</text>

  <rect class="box accent2" x="345" y="920" width="230" height="170"/>
  <text class="label" x="460" y="960" text-anchor="middle">先建地基再扩能力</text>
  <text class="small" x="460" y="995" text-anchor="middle">先跑通、小范围验证</text>
  <text class="small" x="460" y="1024" text-anchor="middle">再扩渠道、扩 Skill、扩自动化</text>
  <text class="small" x="460" y="1053" text-anchor="middle">返工成本会更低</text>

  <rect class="box accent5" x="610" y="920" width="230" height="170"/>
  <text class="label" x="725" y="960" text-anchor="middle">重点盯三类风险</text>
  <text class="small" x="725" y="995" text-anchor="middle">无权限边界就上线</text>
  <text class="small" x="725" y="1024" text-anchor="middle">无日志就做长链任务</text>
  <text class="small" x="725" y="1053" text-anchor="middle">未验证闭环就多人使用</text>

  <path class="line" marker-end="url(#arrow)" d="M460 806 C460 850, 460 860, 460 920"/>

  <text class="small" x="460" y="1168" text-anchor="middle">结论：Week1 学会的不是 6 个点，而是一条可执行、可治理、可复盘的最小运营闭环</text>
</svg>
