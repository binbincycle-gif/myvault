<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 56px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .section { font: 700 34px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #1e3a8a; }
      .nodeTitle { font: 700 38px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .nodeSub { font: 500 26px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #334155; }
      .label { font: 600 30px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .small { font: 500 24px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; }
      .cloud { fill: #eef4ff; stroke: #6b8ff2; stroke-width: 4; stroke-dasharray: 8 10; }
      .coreWrap { fill: #fff7ed; stroke: #fb923c; stroke-width: 5; }
      .runtimeWrap { fill: #f0fdf4; stroke: #22c55e; stroke-width: 5; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 3; }
      .arrow { stroke: #3b82f6; stroke-width: 5; fill: none; marker-end: url(#arr); }
      .arrowThin { stroke: #3b82f6; stroke-width: 4; fill: none; marker-end: url(#arr); }
    </style>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3b82f6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="800" y="84" text-anchor="middle">OpenClaw 系统架构（学习版）</text>

  <!-- channel cloud -->
  <rect class="cloud" x="220" y="130" width="1160" height="180" rx="90" ry="90"/>
  <text class="section" x="800" y="198" text-anchor="middle">多通道接入（Channel）</text>
  <text class="label" x="500" y="258" text-anchor="middle">Telegram</text>
  <text class="label" x="800" y="258" text-anchor="middle">Slack / Discord</text>
  <text class="label" x="1110" y="258" text-anchor="middle">Web / API</text>

  <!-- core wrapper -->
  <rect class="coreWrap" x="130" y="350" width="1340" height="360" rx="44" ry="44"/>
  <text class="section" x="800" y="408" text-anchor="middle" fill="#b45309">核心执行链路（Agent Loop）</text>

  <!-- core nodes -->
  <g filter="url(#shadow)">
    <rect class="box" x="205" y="465" width="280" height="190" rx="24" ry="24"/>
    <rect class="box" x="525" y="465" width="280" height="190" rx="24" ry="24"/>
    <rect class="box" x="845" y="465" width="280" height="190" rx="24" ry="24"/>
    <rect class="box" x="1165" y="465" width="240" height="190" rx="24" ry="24"/>
  </g>

  <text class="nodeTitle" x="345" y="540" text-anchor="middle">LLM</text>
  <text class="nodeSub" x="345" y="585" text-anchor="middle">理解意图 / 任务拆解</text>

  <text class="nodeTitle" x="665" y="540" text-anchor="middle">Memory</text>
  <text class="nodeSub" x="665" y="585" text-anchor="middle">会话上下文 / 记忆</text>

  <text class="nodeTitle" x="985" y="540" text-anchor="middle">Skills / Tools</text>
  <text class="nodeSub" x="985" y="585" text-anchor="middle">read / exec / browser</text>

  <text class="nodeTitle" x="1285" y="540" text-anchor="middle">Cron</text>
  <text class="nodeSub" x="1285" y="585" text-anchor="middle">自动化调度 / 触发</text>

  <!-- arrows top to core -->
  <path class="arrowThin" d="M500,305 L340,455"/>
  <path class="arrowThin" d="M800,305 L665,455"/>
  <path class="arrowThin" d="M1110,305 L980,455"/>
  <path class="arrowThin" d="M1220,305 L1280,455"/>

  <!-- core arrows -->
  <path class="arrow" d="M485,560 L525,560"/>
  <path class="arrow" d="M805,560 L845,560"/>
  <path class="arrow" d="M1125,560 L1165,560"/>
  <path class="arrowThin" d="M845,605 L805,605"/>
  <path class="arrowThin" d="M525,605 L485,605"/>

  <!-- runtime -->
  <rect class="runtimeWrap" x="200" y="760" width="1200" height="150" rx="26" ry="26"/>
  <text class="section" x="800" y="820" text-anchor="middle" fill="#166534">执行环境（Runtime）</text>
  <text class="label" x="480" y="875" text-anchor="middle">Shell</text>
  <text class="label" x="800" y="875" text-anchor="middle">Browser</text>
  <text class="label" x="1120" y="875" text-anchor="middle">Network / API</text>

  <!-- down arrows -->
  <path class="arrow" d="M345,655 L345,753"/>
  <path class="arrow" d="M985,655 L800,753"/>
  <path class="arrow" d="M1285,655 L1285,753"/>
</svg>
