<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
  <rect width="960" height="720" fill="#fcfbf7"/>
  <style>
    .title { font: 700 28px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#222; }
    .label { font: 600 20px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#222; }
    .text { font: 16px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#333; }
    .box { fill:#fffdf8; stroke:#2f2f2f; stroke-width:3; rx:18; ry:18; }
    .line { stroke:#2f2f2f; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .dash { stroke:#666; stroke-width:2.5; fill:none; stroke-dasharray:8 8; stroke-linecap:round; }
  </style>

  <text x="52" y="56" class="title">Day15 Browser 自动化基础闭环</text>

  <rect x="60" y="100" width="230" height="124" class="box"/>
  <text x="92" y="138" class="label">1. 理解页面</text>
  <text x="92" y="170" class="text">• 打开目标页面</text>
  <text x="92" y="196" class="text">• 获取 snapshot</text>
  <text x="92" y="222" class="text">• 识别按钮/输入框/列表</text>

  <rect x="366" y="100" width="230" height="124" class="box"/>
  <text x="398" y="138" class="label">2. 执行动作</text>
  <text x="398" y="170" class="text">• click / type / select</text>
  <text x="398" y="196" class="text">• 基于 ref 操作元素</text>
  <text x="398" y="222" class="text">• 避免盲点与硬等待</text>

  <rect x="672" y="100" width="230" height="124" class="box"/>
  <text x="704" y="138" class="label">3. 校验结果</text>
  <text x="704" y="170" class="text">• 页面是否跳转</text>
  <text x="704" y="196" class="text">• 提示是否出现</text>
  <text x="704" y="222" class="text">• 列表/状态是否刷新</text>

  <path d="M292 162 C320 150, 336 150, 364 162" class="line"/>
  <path d="M354 152 L364 162 L353 171" class="line"/>
  <path d="M598 162 C626 150, 642 150, 670 162" class="line"/>
  <path d="M660 152 L670 162 L659 171" class="line"/>

  <rect x="88" y="306" width="320" height="168" class="box"/>
  <text x="120" y="346" class="label">Browser 的稳定性关键</text>
  <text x="120" y="382" class="text">• 先看结构，再动手</text>
  <text x="120" y="410" class="text">• 等待状态，不等待运气</text>
  <text x="120" y="438" class="text">• 动作后必须有结果证据</text>

  <rect x="552" y="306" width="320" height="168" class="box"/>
  <text x="584" y="346" class="label">常见失败恢复</text>
  <text x="584" y="382" class="text">• 元素没找到 → 重取 snapshot</text>
  <text x="584" y="410" class="text">• 页面被挡住 → 先处理弹窗</text>
  <text x="584" y="438" class="text">• 登录态失效 → 人工接管</text>

  <path d="M408 390 C448 390, 504 390, 550 390" class="dash"/>
  <path d="M540 381 L550 390 L540 399" class="line"/>

  <rect x="214" y="540" width="532" height="110" class="box"/>
  <text x="248" y="582" class="label">一句话</text>
  <text x="248" y="616" class="text">Browser 自动化不是录鼠标，而是把“页面理解 → 动作执行 → 结果校验 → 失败回退”做成流程。</text>

  <path d="M784 228 C842 266, 860 314, 842 376 C826 432, 780 474, 720 506" class="line"/>
  <path d="M725 496 L720 506 L731 507" class="line"/>
  <path d="M240 506 C170 474, 128 430, 118 372 C108 310, 132 252, 182 224" class="line"/>
  <path d="M177 235 L182 224 L171 225" class="line"/>
</svg>
