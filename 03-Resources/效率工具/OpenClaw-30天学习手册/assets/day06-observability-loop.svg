<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <defs>
    <style>
      .bg { fill: #fcfbf7; }
      .title { font: 700 34px "HanziPen SC","Hannotate SC","KaiTi","STKaiti","PingFang SC",sans-serif; fill: #24313f; }
      .label { font: 600 24px "HanziPen SC","Hannotate SC","KaiTi","STKaiti","PingFang SC",sans-serif; fill: #24313f; }
      .text { font: 400 20px "HanziPen SC","Hannotate SC","KaiTi","STKaiti","PingFang SC",sans-serif; fill: #425466; }
      .box { fill: #fffdf8; stroke: #3d4b59; stroke-width: 3.2; rx: 22; ry: 22; }
      .line { fill: none; stroke: #3d4b59; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #7b8794; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 9 9; }
      .hint { font: 400 18px "HanziPen SC","Hannotate SC","KaiTi","STKaiti","PingFang SC",sans-serif; fill: #5f6c79; }
    </style>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L12,7 L1,13" fill="none" stroke="#3d4b59" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="820" rx="28"/>
  <text class="title" x="56" y="64">Day06｜OpenClaw 可观测性闭环</text>
  <text class="hint" x="58" y="98">目标：让“任务做了什么、卡在哪、该谁处理”都能被看见</text>

  <rect class="box" x="70" y="150" width="240" height="120"/>
  <text class="label" x="130" y="198">1. 任务发起</text>
  <text class="text" x="103" y="232">消息 / Cron / Browser / Tool</text>

  <rect class="box" x="360" y="150" width="240" height="120"/>
  <text class="label" x="423" y="198">2. 统一打点</text>
  <text class="text" x="390" y="232">记录 session、task、trace</text>

  <rect class="box" x="650" y="150" width="240" height="120"/>
  <text class="label" x="706" y="198">3. 执行过程</text>
  <text class="text" x="692" y="232">模型推理、工具调用、重试</text>

  <rect class="box" x="940" y="150" width="190" height="120"/>
  <text class="label" x="980" y="198">4. 结果沉淀</text>
  <text class="text" x="968" y="232">成功 / 失败 / 耗时</text>

  <path class="line" d="M310 210 C330 210, 338 210, 360 210" marker-end="url(#arrow)"/>
  <path class="line" d="M600 210 C620 210, 628 210, 650 210" marker-end="url(#arrow)"/>
  <path class="line" d="M890 210 C910 210, 918 210, 940 210" marker-end="url(#arrow)"/>

  <rect class="box" x="120" y="380" width="270" height="150"/>
  <text class="label" x="206" y="430">日志层</text>
  <text class="text" x="154" y="468">时间戳、参数、错误、耗时</text>
  <text class="text" x="150" y="502">适合排查“为什么失败”</text>

  <rect class="box" x="465" y="380" width="270" height="150"/>
  <text class="label" x="552" y="430">状态层</text>
  <text class="text" x="504" y="468">会话状态、任务状态、心跳</text>
  <text class="text" x="496" y="502">适合判断“现在做到哪”</text>

  <rect class="box" x="810" y="380" width="270" height="150"/>
  <text class="label" x="893" y="430">追踪层</text>
  <text class="text" x="853" y="468">Trace / Span 串起全链路</text>
  <text class="text" x="849" y="502">适合定位“卡在哪一跳”</text>

  <path class="dash" d="M480 270 C420 320, 360 340, 280 380"/>
  <path class="dash" d="M620 270 C620 320, 620 340, 620 380"/>
  <path class="dash" d="M770 270 C840 320, 900 340, 945 380"/>

  <rect class="box" x="155" y="620" width="260" height="110"/>
  <text class="label" x="224" y="668">运营 / 管理者看板</text>
  <text class="text" x="207" y="702">成功率、SLA、成本、告警</text>

  <rect class="box" x="470" y="620" width="260" height="110"/>
  <text class="label" x="541" y="668">开发 / 调试视角</text>
  <text class="text" x="527" y="702">日志检索、失败复盘、重放</text>

  <rect class="box" x="785" y="620" width="260" height="110"/>
  <text class="label" x="863" y="668">合规 / 审计视角</text>
  <text class="text" x="844" y="702">留痕、脱敏、责任边界</text>

  <path class="line" d="M255 530 C255 565, 255 580, 285 620" marker-end="url(#arrow)"/>
  <path class="line" d="M600 530 C600 565, 600 580, 600 620" marker-end="url(#arrow)"/>
  <path class="line" d="M945 530 C945 565, 945 580, 915 620" marker-end="url(#arrow)"/>
</svg>
