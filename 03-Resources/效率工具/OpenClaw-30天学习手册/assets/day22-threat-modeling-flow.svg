<svg width="720" height="980" viewBox="0 0 720 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #fcfbf7; }
      .title { font: 700 27px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #1f2937; }
      .sub { font: 16px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #6b7280; }
      .label { font: 700 20px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #111827; }
      .text { font: 16px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #374151; }
      .box { fill: #fffef9; stroke: #374151; stroke-width: 2.4; rx: 18; ry: 18; }
      .arrow { stroke: #374151; stroke-width: 2.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .chip { fill: #eef6ff; stroke: #60a5fa; stroke-width: 1.8; rx: 14; ry: 14; }
      .chipText { font: 15px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #1e40af; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="720" height="980"/>
  <text class="title" x="44" y="58">Day22｜安全威胁建模与风险缓解</text>
  <text class="sub" x="46" y="88">把“高能力”关进“清边界、可追溯、能恢复”的流程里</text>

  <rect class="box" x="80" y="126" width="560" height="102"/>
  <text class="label" x="112" y="162">1. 资产与入口盘点</text>
  <text class="text" x="112" y="194">凭证、文件、会话、渠道、Browser、Shell、节点</text>

  <path class="arrow" marker-end="url(#arrow)" d="M360 232 C360 252, 360 268, 360 288"/>

  <rect class="box" x="80" y="292" width="560" height="112"/>
  <text class="label" x="112" y="330">2. 威胁场景拆解</text>
  <text class="text" x="112" y="362">Prompt 注入、权限越界、数据泄漏、自动化连锁故障</text>
  <rect class="chip" x="112" y="376" width="188" height="34"/>
  <text class="chipText" x="130" y="399">先问最坏会怎样</text>

  <path class="arrow" marker-end="url(#arrow)" d="M360 408 C360 428, 360 444, 360 464"/>

  <rect class="box" x="80" y="468" width="560" height="104"/>
  <text class="label" x="112" y="505">3. 风险定级</text>
  <text class="text" x="112" y="537">按发生概率、业务影响、可恢复性决定治理优先级</text>

  <path class="arrow" marker-end="url(#arrow)" d="M360 576 C360 596, 360 612, 360 632"/>

  <rect class="box" x="80" y="636" width="560" height="124"/>
  <text class="label" x="112" y="674">4. 三层控制措施</text>
  <text class="text" x="112" y="706">预防：allowlist、审批、最小权限、脱敏</text>
  <text class="text" x="112" y="734">侦测：审计日志、告警、速率限制、异常阈值</text>

  <path class="arrow" marker-end="url(#arrow)" d="M360 764 C360 784, 360 800, 360 820"/>

  <rect class="box" x="80" y="824" width="560" height="104"/>
  <text class="label" x="112" y="861">5. 恢复与复盘</text>
  <text class="text" x="112" y="893">回滚、禁用入口、吊销 token、更新规则与自检清单</text>

  <path class="arrow" marker-end="url(#arrow)" d="M104 856 C44 808, 44 206, 80 174"/>
  <text class="sub" x="96" y="950">闭环重点：每次复盘都要反哺资产清单、审批边界与运行规则。</text>
</svg>
