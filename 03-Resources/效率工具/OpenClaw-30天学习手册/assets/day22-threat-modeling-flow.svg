<svg width="960" height="680" viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #fcfbf7; }
      .title { font: 700 28px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #1f2937; }
      .label { font: 600 20px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #1f2937; }
      .text { font: 16px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #374151; }
      .box { fill: #fffef9; stroke: #374151; stroke-width: 2.5; rx: 18; ry: 18; }
      .arrow { stroke: #374151; stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .note { font: 15px "HanziPen SC", "Hannotate SC", "KaiTi", "STKaiti", "PingFang SC", sans-serif; fill: #6b7280; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#374151" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="680"/>
  <text class="title" x="60" y="60">Day22｜安全威胁建模与风险缓解流程</text>
  <text class="note" x="60" y="92">先识别暴露面，再评估影响，最后把控制措施嵌入执行链路</text>

  <rect class="box" x="70" y="140" width="220" height="120"/>
  <text class="label" x="100" y="180">1. 资产与入口盘点</text>
  <text class="text" x="100" y="214">- 渠道 / Browser / Shell / 节点</text>
  <text class="text" x="100" y="240">- 凭证 / 文件 / 会话上下文</text>

  <rect class="box" x="370" y="140" width="220" height="120"/>
  <text class="label" x="400" y="180">2. 威胁场景拆解</text>
  <text class="text" x="400" y="214">- Prompt 注入</text>
  <text class="text" x="400" y="240">- 权限越界 / 数据泄漏</text>

  <rect class="box" x="670" y="140" width="220" height="120"/>
  <text class="label" x="700" y="180">3. 风险定级</text>
  <text class="text" x="700" y="214">- 发生概率</text>
  <text class="text" x="700" y="240">- 业务影响 / 可恢复性</text>

  <rect class="box" x="70" y="380" width="220" height="140"/>
  <text class="label" x="98" y="420">4. 预防性控制</text>
  <text class="text" x="98" y="454">- allowlist / approval</text>
  <text class="text" x="98" y="480">- 脱敏 / 最小权限</text>
  <text class="text" x="98" y="506">- 环境隔离</text>

  <rect class="box" x="370" y="380" width="220" height="140"/>
  <text class="label" x="400" y="420">5. 侦测性控制</text>
  <text class="text" x="400" y="454">- 审计日志</text>
  <text class="text" x="400" y="480">- 异常告警 / 熔断</text>
  <text class="text" x="400" y="506">- 重试边界</text>

  <rect class="box" x="670" y="380" width="220" height="140"/>
  <text class="label" x="700" y="420">6. 恢复与复盘</text>
  <text class="text" x="700" y="454">- 回滚 / 禁用入口</text>
  <text class="text" x="700" y="480">- 责任归因</text>
  <text class="text" x="700" y="506">- 规则持续更新</text>

  <path class="arrow" marker-end="url(#arrow)" d="M290 200 C320 200, 340 200, 370 200"/>
  <path class="arrow" marker-end="url(#arrow)" d="M590 200 C620 200, 640 200, 670 200"/>
  <path class="arrow" marker-end="url(#arrow)" d="M780 260 C780 305, 780 330, 780 380"/>
  <path class="arrow" marker-end="url(#arrow)" d="M670 450 C640 450, 620 450, 590 450"/>
  <path class="arrow" marker-end="url(#arrow)" d="M370 450 C340 450, 320 450, 290 450"/>
  <path class="arrow" marker-end="url(#arrow)" d="M180 380 C180 336, 180 304, 180 260"/>

  <text class="note" x="120" y="590">管理视角：把“安全”从上线前检查，变成日常运行中的默认机制。</text>
</svg>
