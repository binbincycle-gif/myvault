<svg width="1080" height="760" viewBox="0 0 1080 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #fcfbf7; }
      .line { fill: none; stroke: #2f3b52; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { fill: none; stroke: #2f3b52; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .title { font-family: 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; font-size: 34px; fill: #24324a; }
      .text { font-family: 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; font-size: 24px; fill: #24324a; }
      .small { font-family: 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; font-size: 21px; fill: #3c4963; }
      .accent { fill: #eef4ff; }
      .warn { fill: #fff3e6; }
      .ok { fill: #edf8ee; }
      .audit { fill: #f4ecff; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L11,6 L1,11" class="arrow"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="760" class="bg"/>
  <text x="60" y="70" class="title">Day05 Shell执行能力与安全边界</text>
  <text x="60" y="108" class="small">把“能跑命令”变成“按边界执行、按结果治理”</text>

  <rect x="70" y="170" rx="22" ry="22" width="200" height="110" class="line accent"/>
  <text x="112" y="218" class="text">用户请求</text>
  <text x="98" y="252" class="small">自然语言 / 参数</text>

  <rect x="330" y="150" rx="22" ry="22" width="230" height="150" class="line accent"/>
  <text x="382" y="198" class="text">策略预检查</text>
  <text x="368" y="232" class="small">身份、场景、审批</text>
  <text x="366" y="264" class="small">高危动作先拦截</text>

  <rect x="620" y="150" rx="22" ry="22" width="220" height="150" class="line warn"/>
  <text x="666" y="198" class="text">命令模板化</text>
  <text x="648" y="232" class="small">白名单参数</text>
  <text x="648" y="264" class="small">工作目录 / 超时</text>

  <rect x="890" y="150" rx="22" ry="22" width="140" height="150" class="line ok"/>
  <text x="931" y="205" class="text">exec</text>
  <text x="917" y="240" class="small">真正执行</text>

  <rect x="860" y="390" rx="22" ry="22" width="180" height="120" class="line accent"/>
  <text x="896" y="438" class="text">结果采集</text>
  <text x="888" y="472" class="small">stdout / stderr</text>

  <rect x="585" y="390" rx="22" ry="22" width="210" height="120" class="line audit"/>
  <text x="649" y="438" class="text">审计留痕</text>
  <text x="624" y="472" class="small">命令摘要 / 耗时 / 结果码</text>

  <rect x="330" y="390" rx="22" ry="22" width="190" height="120" class="line ok"/>
  <text x="372" y="438" class="text">结构化反馈</text>
  <text x="366" y="472" class="small">结论 / 风险 / 下一步</text>

  <rect x="80" y="390" rx="22" ry="22" width="180" height="120" class="line warn"/>
  <text x="122" y="438" class="text">人工介入</text>
  <text x="110" y="472" class="small">失败升级或补位</text>

  <path d="M270 225 C298 225, 305 225, 330 225" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M560 225 C585 225, 590 225, 620 225" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M840 225 C865 225, 868 225, 890 225" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M960 300 C960 340, 955 350, 950 390" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M860 450 C830 450, 820 450, 795 450" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M585 450 C560 450, 550 450, 520 450" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M330 450 C300 450, 292 450, 260 450" class="arrow" marker-end="url(#arrowhead)"/>

  <path d="M445 300 C445 332, 445 346, 445 390" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="458" y="346" class="small">不通过</text>

  <path d="M730 300 C730 334, 730 352, 730 390" class="arrow" marker-end="url(#arrowhead)"/>
  <text x="742" y="350" class="small">全程记录</text>

  <text x="72" y="620" class="text">关键治理点</text>
  <text x="74" y="660" class="small">1. 先判断“能不能执行”，再决定“执行什么”。</text>
  <text x="74" y="695" class="small">2. Shell 输出必须带结果码，不能只看有没有返回文本。</text>
  <text x="540" y="660" class="small">3. 审计是上线条件，不是出了事故后才补。</text>
  <text x="540" y="695" class="small">4. 失败要可升级到人工，而不是静默卡死。</text>
</svg>
