<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#fffdfa}
      .title{font:700 56px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#111}
      .text{font:700 40px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#111}
      .label{font:600 31px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#666}
      .box{fill:#fff;stroke:#222;stroke-width:6}
      .box-highlight{fill:#fff;stroke:#d32f2f;stroke-width:8}
      .box2{fill:#f5f5f5;stroke:#333;stroke-width:4}
      .arr{stroke:#3b6fd0;stroke-width:5;fill:none;marker-end:url(#a)}
      .highlight{fill:#fff3e0;stroke:#ff9800;stroke-width:5}
      .highlight-red{fill:#ffebee;stroke:#d32f2f;stroke-width:6}
    </style>
    <marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0.6,0.6 L5,3 L0.6,5.4" fill="none" stroke="#3b6fd0" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="900"/>

  <!-- 卡通小龙虾 -->
  <g transform="translate(25, 5)">
    <ellipse fill="#FF6B6B" cx="50" cy="40" rx="30" ry="22"/>
    <ellipse fill="#FF8E8E" cx="45" cy="35" rx="15" ry="10"/>
    <circle fill="#FF6B6B" cx="75" cy="35" r="18"/>
    <circle fill="#fff" cx="80" cy="30" r="8"/>
    <circle fill="#fff" cx="68" cy="30" r="8"/>
    <circle fill="#333" cx="82" cy="30" r="4"/>
    <circle fill="#333" cx="70" cy="30" r="4"/>
    <circle fill="#fff" cx="84" cy="28" r="1.5"/>
    <circle fill="#fff" cx="72" cy="28" r="1.5"/>
    <ellipse fill="#FFAAAA" cx="85" cy="40" rx="4" ry="2" opacity="0.6"/>
    <ellipse fill="#FFAAAA" cx="65" cy="40" rx="4" ry="2" opacity="0.6"/>
    <path stroke="#333" stroke-width="2" fill="none" d="M73,42 Q78,46 83,42"/>
    <path stroke="#FF6B6B" stroke-width="3" fill="none" stroke-linecap="round" d="M85,20 Q95,5 110,15 Q120,25 105,25"/>
    <path stroke="#FF6B6B" stroke-width="3" fill="none" stroke-linecap="round" d="M90,22 Q100,15 115,22"/>
    <ellipse fill="#FF6B6B" cx="55" cy="55" rx="12" ry="8"/>
    <ellipse fill="#FF6B6B" cx="95" cy="55" rx="12" ry="8"/>
    <line stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" x1="40" y1="60" x2="32" y2="72"/>
    <line stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" x1="50" y1="62" x2="45" y2="75"/>
    <line stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" x1="60" y1="62" x2="60" y2="75"/>
    <line stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" x1="70" y1="60" x2="75" y2="72"/>
    <path fill="#FF6B6B" d="M20,35 Q5,30 10,45 Q15,55 25,45"/>
  </g>

  <!-- 标题 -->
  <text class="title" x="650" y="65" text-anchor="middle">Day05 Shell执行与安全边界</text>

  <!-- 输入层 - 加红框 -->
  <rect class="box-highlight" x="350" y="130" width="500" height="80" rx="15" fill="#fff8e1"/>
  <text class="text" x="600" y="185" text-anchor="middle">AI/用户指令</text>

  <path class="arr" d="M600,210 L600,240"/>

  <!-- 执行引擎 -->
  <rect class="box" x="250" y="250" width="700" height="100" rx="15" fill="#fff8e1" stroke="#ff9800"/>
  <text class="text" x="600" y="310" text-anchor="middle">Shell 执行引擎</text>
  <text class="label" x="420" y="345" text-anchor="middle">exec 工具</text>
  <text class="label" x="780" y="345" text-anchor="middle">参数配置</text>

  <!-- 箭头 -->
  <path class="arr" d="M600,350 L600,380"/>

  <!-- 三大边界 -->
  <rect class="box" x="30" y="390" width="370" height="250" rx="15" fill="#f5fff5" stroke="#4caf50"/>
  <text class="text" x="215" y="440" text-anchor="middle" fill="#2e7d32">安全边界</text>
  <rect class="box2" x="55" y="470" width="320" height="55" rx="8"/>
  <text class="label" x="215" y="508" text-anchor="middle">命令模板化</text>
  <rect class="box2" x="55" y="535" width="320" height="55" rx="8"/>
  <text class="label" x="215" y="573" text-anchor="middle">参数白名单</text>
  <rect class="box2" x="55" y="600" width="320" height="55" rx="8"/>
  <text class="label" x="215" y="638" text-anchor="middle">路径约束</text>

  <rect class="box" x="415" y="390" width="370" height="250" rx="15" fill="#fff3e0" stroke="#ff9800"/>
  <text class="text" x="600" y="440" text-anchor="middle" fill="#e65100">执行控制</text>
  <rect class="box2" x="440" y="470" width="320" height="55" rx="8"/>
  <text class="label" x="600" y="508" text-anchor="middle">超时限制</text>
  <rect class="box2" x="440" y="535" width="320" height="55" rx="8"/>
  <text class="label" x="600" y="573" text-anchor="middle">并发上限</text>
  <rect class="box2" x="440" y="600" width="320" height="55" rx="8"/>
  <text class="label" x="600" y="638" text-anchor="middle">高危指令拦截</text>

  <rect class="box" x="800" y="390" width="370" height="250" rx="15" fill="#e3f2fd" stroke="#1976d2"/>
  <text class="text" x="985" y="440" text-anchor="middle" fill="#1565c0">审计追溯</text>
  <rect class="box2" x="825" y="470" width="320" height="55" rx="8"/>
  <text class="label" x="985" y="508" text-anchor="middle">stdout/stderr</text>
  <rect class="box2" x="825" y="535" width="320" height="55" rx="8"/>
  <text class="label" x="985" y="573" text-anchor="middle">Exit Code</text>
  <rect class="box2" x="825" y="600" width="320" height="55" rx="8"/>
  <text class="label" x="985" y="638" text-anchor="middle">执行日志</text>

  <!-- 结果 -->
  <path class="arr" d="M215,640 L215,700 L600,700"/>
  <path class="arr" d="M600,640 L600,700"/>
  <path class="arr" d="M985,640 L985,700 L600,700"/>

  <rect class="box" x="250" y="710" width="700" height="70" rx="12" fill="#f5f5f5"/>
  <text class="text" x="600" y="760" text-anchor="middle">结构化结果返回 → 可进入下一步自动化</text>

  <!-- 底部 - 加红框强调 -->
  <rect class="highlight-red" x="100" y="810" width="1000" height="50" rx="12"/>
  <text class="label" x="600" y="845" text-anchor="middle">核心：能力越强，越要边界清晰</text>
</svg>