<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="HanziPen SC, Hannotate SC, KaiTi, STKaiti, PingFang SC, sans-serif">
  <!-- 背景 -->
  <rect width="400" height="320" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Skill 调用流程</text>
  
  <!-- 节点定义 -->
  <!-- 用户输入 -->
  <rect x="20" y="50" width="80" height="36" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5"/>
  <text x="60" y="73" text-anchor="middle" font-size="12" fill="#1565c0">用户意图</text>
  
  <!-- Agent 理解 -->
  <rect x="130" y="50" width="80" height="36" rx="4" fill="#fff3e0" stroke="#f57c00" stroke-width="1.5"/>
  <text x="170" y="73" text-anchor="middle" font-size="12" fill="#e65100">Agent 理解</text>
  
  <!-- Skill 匹配 -->
  <rect x="240" y="50" width="80" height="36" rx="4" fill="#e8f5e9" stroke="#388e3c" stroke-width="1.5"/>
  <text x="280" y="73" text-anchor="middle" font-size="12" fill="#2e7d32">Skill 匹配</text>
  
  <!-- 箭头 1 -->
  <path d="M100 68 L125 68" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 箭头 2 -->
  <path d="M210 68 L235 68" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 水平分隔线 -->
  <line x1="20" y1="110" x2="380" y2="110" stroke="#ddd" stroke-width="1" stroke-dasharray="4,2"/>
  
  <!-- Skill 执行器 -->
  <rect x="140" y="130" width="120" height="50" rx="4" fill="#fce4ec" stroke="#c2185b" stroke-width="1.5"/>
  <text x="200" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#ad1457">Skill Executor</text>
  <text x="200" y="168" text-anchor="middle" font-size="10" fill="#880e4f">执行 + 超时 + 幂等</text>
  
  <!-- 输入参数校验 -->
  <rect x="20" y="200" width="90" height="40" rx="4" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="65" y="225" text-anchor="middle" font-size="11" fill="#6a1b9a">输入校验</text>
  
  <!-- 业务逻辑 -->
  <rect x="130" y="200" width="90" height="40" rx="4" fill="#fff9c4" stroke="#f9a825" stroke-width="1.5"/>
  <text x="175" y="225" text-anchor="middle" font-size="11" fill="#f57f17">业务逻辑</text>
  
  <!-- 输出格式化 -->
  <rect x="240" y="200" width="90" height="40" rx="4" fill="#e0f7fa" stroke="#0097a7" stroke-width="1.5"/>
  <text x="285" y="225" text-anchor="middle" font-size="11" fill="#00838f">输出格式化</text>
  
  <!-- 箭头连接到执行器 -->
  <path d="M65 195 L65 185 L140 185" stroke="#666" stroke-width="1.2" fill="none"/>
  <path d="M175 195 L175 185" stroke="#666" stroke-width="1.2" fill="none"/>
  <path d="M285 195 L285 185 L260 185" stroke="#666" stroke-width="1.2" fill="none"/>
  
  <!-- 箭头从执行器向下 -->
  <path d="M200 180 L200 195" stroke="#666" stroke-width="1.2" fill="none"/>
  
  <!-- 返回结果 -->
  <rect x="130" y="260" width="140" height="36" rx="4" fill="#e1f5fe" stroke="#0288d1" stroke-width="1.5"/>
  <text x="200" y="283" text-anchor="middle" font-size="12" fill="#01579b">结构化结果返回</text>
  
  <!-- 箭头从执行器到结果 -->
  <path d="M200 250 L200 255" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  
  <!-- 定义箭头标记 -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="#666"/>
    </marker>
  </defs>
</svg>