<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#fffdfa}
      .title{font:700 56px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#111}
      .text{font:700 40px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#111}
      .label{font:600 31px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#666}
      .box{fill:#fff;stroke:#222;stroke-width:6}
      .box-highlight{fill:#fff;stroke:#d32f2f;stroke-width:8}
      .box2{fill:#f5f5f5;stroke:#333;stroke-width:4}
      .arr{stroke:#3b6fd0;stroke-width:5;fill:none;marker-end:url(#a)}
      .highlight{fill:#fff3e0;stroke:#ff9800;stroke-width:5}
      .highlight-red{fill:#ffebee;stroke:#d32f2f;stroke-width:6}
    </style>
    <marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0.6,0.6 L5,3 L0.6,5.4" fill="none" stroke="#3b6fd0" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="900"/>

  <!-- 卡通小龙虾 - 更可爱版本 -->
  <g transform="translate(25, 5)">
    <!-- 身体 - 圆润 -->
    <ellipse fill="#FF6B6B" cx="50" cy="40" rx="30" ry="22"/>
    <!-- 红色渐变效果 -->
    <ellipse fill="#FF8E8E" cx="45" cy="35" rx="15" ry="10"/>
    <!-- 头部 - 大圆 -->
    <circle fill="#FF6B6B" cx="75" cy="35" r="18"/>
    <!-- 大眼睛 - 卡通风格 -->
    <circle fill="#fff" cx="80" cy="30" r="8"/>
    <circle fill="#fff" cx="68" cy="30" r="8"/>
    <circle fill="#333" cx="82" cy="30" r="4"/>
    <circle fill="#333" cx="70" cy="30" r="4"/>
    <!-- 高光 -->
    <circle fill="#fff" cx="84" cy="28" r="1.5"/>
    <circle fill="#fff" cx="72" cy="28" r="1.5"/>
    <!-- 腮红 -->
    <ellipse fill="#FFAAAA" cx="85" cy="40" rx="4" ry="2" opacity="0.6"/>
    <ellipse fill="#FFAAAA" cx="65" cy="40" rx="4" ry="2" opacity="0.6"/>
    <!-- 微笑 -->
    <path stroke="#333" stroke-width="2" fill="none" d="M73,42 Q78,46 83,42"/>
    <!-- 触须 - 卷曲可爱 -->
    <path stroke="#FF6B6B" stroke-width="3" fill="none" stroke-linecap="round" d="M85,20 Q95,5 110,15 Q120,25 105,25"/>
    <path stroke="#FF6B6B" stroke-width="3" fill="none" stroke-linecap="round" d="M90,22 Q100,15 115,22"/>
    <!-- 钳子 - 大大可爱 -->
    <ellipse fill="#FF6B6B" cx="55" cy="55" rx="12" ry="8"/>
    <ellipse fill="#FF6B6B" cx="95" cy="55" rx="12" ry="8"/>
    <!-- 小脚 -->
    <line stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" x1="40" y1="60" x2="32" y2="72"/>
    <line stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" x1="50" y1="62" x2="45" y2="75"/>
    <line stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" x1="60" y1="62" x2="60" y2="75"/>
    <line stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" x1="70" y1="60" x2="75" y2="72"/>
    <!-- 尾巴 -->
    <path fill="#FF6B6B" d="M20,35 Q5,30 10,45 Q15,55 25,45"/>
  </g>

  <!-- 标题 -->
  <text class="title" x="650" y="65" text-anchor="middle">Day03 本地启动与最小闭环</text>

  <!-- 最小闭环四步 -->
  <rect class="box" x="50" y="100" width="220" height="90" rx="10"/>
  <text class="text" x="160" y="150" text-anchor="middle">1. 服务启动</text>
  <text class="label" x="160" y="180" text-anchor="middle">Gateway在线</text>

  <rect class="box" x="290" y="100" width="220" height="90" rx="10"/>
  <text class="text" x="400" y="150" text-anchor="middle">2. 指令接收</text>
  <text class="label" x="400" y="180" text-anchor="middle">触发执行</text>

  <rect class="box" x="530" y="100" width="220" height="90" rx="10"/>
  <text class="text" x="640" y="150" text-anchor="middle">3. 工具执行</text>
  <text class="label" x="640" y="180" text-anchor="middle">结果返回</text>

  <rect class="box" x="770" y="100" width="220" height="90" rx="10"/>
  <text class="text" x="880" y="150" text-anchor="middle">4. 验证可读</text>
  <text class="label" x="880" y="180" text-anchor="middle">日志/状态</text>

  <!-- 箭头连接 -->
  <path class="arr" d="M270,145 L290,145"/>
  <path class="arr" d="M510,145 L530,145"/>
  <path class="arr" d="M750,145 L770,145"/>

  <!-- 核心组件 -->
  <rect class="box" x="300" y="230" width="600" height="180" rx="12" fill="#f8f9fa" stroke="#333" stroke-width="4"/>
  <text class="text" x="600" y="270" text-anchor="middle">核心组件</text>
  
  <rect class="box2" x="330" y="295" width="240" height="45" rx="6"/>
  <text class="label" x="450" y="327" text-anchor="middle">Gateway 服务</text>
  
  <rect class="box2" x="330" y="355" width="240" height="45" rx="6"/>
  <text class="label" x="450" y="387" text-anchor="middle">Session 上下文</text>
  
  <rect class="box2" x="630" y="295" width="240" height="45" rx="6"/>
  <text class="label" x="750" y="327" text-anchor="middle">Tool Runtime</text>
  
  <rect class="box2" x="630" y="355" width="240" height="45" rx="6"/>
  <text class="label" x="750" y="387" text-anchor="middle">状态与日志</text>

  <!-- 常见失败点 -->
  <rect class="box" x="50" y="450" width="320" height="180" rx="10" fill="#fff5f5" stroke="#e57373" stroke-width="4"/>
  <text class="text" x="210" y="490" text-anchor="middle" fill="#c62828">常见失败</text>
  <text class="label" x="210" y="530" text-anchor="middle">服务未就绪</text>
  <text class="label" x="210" y="565" text-anchor="middle">权限不匹配</text>
  <text class="label" x="210" y="600" text-anchor="middle">路径/目录错误</text>

  <!-- 成功标志 -->
  <rect class="box" x="420" y="450" width="320" height="180" rx="10" fill="#f5fff5" stroke="#66bb6a" stroke-width="4"/>
  <text class="text" x="580" y="490" text-anchor="middle" fill="#2e7d32">可交付标准</text>
  <text class="label" x="580" y="530" text-anchor="middle">✓ 服务可启动</text>
  <text class="label" x="580" y="565" text-anchor="middle">✓ 指令可触发</text>
  <text class="label" x="580" y="600" text-anchor="middle">✓ 结果可验证</text>

  <!-- 业务价值 -->
  <rect class="box" x="790" y="450" width="320" height="180" rx="10" fill="#e3f2fd" stroke="#1976d2" stroke-width="4"/>
  <text class="text" x="950" y="490" text-anchor="middle" fill="#1565c0">业务价值</text>
  <text class="label" x="950" y="530" text-anchor="middle">从主观感受</text>
  <text class="label" x="950" y="565" text-anchor="middle">变为可验证事实</text>
  <text class="label" x="950" y="600" text-anchor="middle">建立团队信任</text>

  <!-- 底部 -->
  <rect class="highlight-red" x="100" y="680" width="1000" height="50" rx="10"/>
  <text class="label" x="600" y="715" text-anchor="middle">不是"能打开" 而是"能完成一次完整输入→执行→验证"</text>

  <!-- 关键点 -->
  <rect class="box" x="100" y="760" width="1000" height="100" rx="10" fill="#f5f5f5" stroke="#666" stroke-width="3"/>
  <text class="text" x="600" y="800" text-anchor="middle">核心要点</text>
  <text class="label" x="350" y="835" text-anchor="middle">✓ 一次成功 ≠ 稳定</text>
  <text class="label" x="600" y="835" text-anchor="middle">✓ 覆盖异常场景才算交付</text>
  <text class="label" x="850" y="835" text-anchor="middle">✓ 环境/权限/路径都要验</text>
</svg>