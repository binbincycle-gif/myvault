<svg width="1200" height="820" viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#fffdfa}
      .title{font:700 52px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#111}
      .text{font:700 36px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#111}
      .label{font:600 28px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#555}
      .box{fill:#fff;stroke:#222;stroke-width:6}
      .box-soft{fill:#f7f7f7;stroke:#333;stroke-width:4}
      .arr{stroke:#3b6fd0;stroke-width:5;fill:none;marker-end:url(#a)}
      .note{fill:#fff3e0;stroke:#ff9800;stroke-width:5}
      .warn{fill:#ffebee;stroke:#d32f2f;stroke-width:6}
      .ok{fill:#f1fff3;stroke:#2e7d32;stroke-width:5}
    </style>
    <marker id="a" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0.6,0.6 L5,3 L0.6,5.4" fill="none" stroke="#3b6fd0" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="820"/>
  <text class="title" x="600" y="64" text-anchor="middle">Day03 本地启动与最小闭环</text>

  <!-- 主闭环 -->
  <rect class="box" x="70" y="110" width="240" height="90" rx="12"/>
  <text class="text" x="190" y="160" text-anchor="middle">1. 服务启动</text>
  <text class="label" x="190" y="188" text-anchor="middle">Gateway在线</text>

  <rect class="box" x="340" y="110" width="240" height="90" rx="12"/>
  <text class="text" x="460" y="160" text-anchor="middle">2. 指令接收</text>
  <text class="label" x="460" y="188" text-anchor="middle">进入Session</text>

  <rect class="box" x="610" y="110" width="240" height="90" rx="12"/>
  <text class="text" x="730" y="160" text-anchor="middle">3. 工具执行</text>
  <text class="label" x="730" y="188" text-anchor="middle">read/exec等</text>

  <rect class="box" x="880" y="110" width="240" height="90" rx="12"/>
  <text class="text" x="1000" y="160" text-anchor="middle">4. 结果校验</text>
  <text class="label" x="1000" y="188" text-anchor="middle">日志/状态</text>

  <path class="arr" d="M310,155 L340,155"/>
  <path class="arr" d="M580,155 L610,155"/>
  <path class="arr" d="M850,155 L880,155"/>

  <!-- 关键组件 -->
  <rect class="box-soft" x="150" y="245" width="900" height="150" rx="12"/>
  <text class="text" x="600" y="285" text-anchor="middle">关键组件检查点</text>
  <rect class="box" x="190" y="305" width="220" height="55" rx="8"/>
  <text class="label" x="300" y="342" text-anchor="middle">Gateway</text>
  <rect class="box" x="440" y="305" width="220" height="55" rx="8"/>
  <text class="label" x="550" y="342" text-anchor="middle">Session</text>
  <rect class="box" x="690" y="305" width="220" height="55" rx="8"/>
  <text class="label" x="800" y="342" text-anchor="middle">Tool Runtime</text>

  <!-- 风险与成功 -->
  <rect class="warn" x="90" y="430" width="360" height="170" rx="12"/>
  <text class="text" x="270" y="470" text-anchor="middle" fill="#b71c1c">常见失败</text>
  <text class="label" x="270" y="510" text-anchor="middle">服务未就绪 / 端口占用</text>
  <text class="label" x="270" y="545" text-anchor="middle">权限策略阻断</text>
  <text class="label" x="270" y="580" text-anchor="middle">路径/环境不一致</text>

  <rect class="ok" x="460" y="430" width="300" height="170" rx="12"/>
  <text class="text" x="610" y="470" text-anchor="middle" fill="#1b5e20">交付标准</text>
  <text class="label" x="610" y="510" text-anchor="middle">可启动 / 可触发</text>
  <text class="label" x="610" y="545" text-anchor="middle">可回执 / 可复盘</text>
  <text class="label" x="610" y="580" text-anchor="middle">失败可定位</text>

  <rect class="note" x="790" y="430" width="320" height="170" rx="12"/>
  <text class="text" x="950" y="470" text-anchor="middle">价值</text>
  <text class="label" x="950" y="510" text-anchor="middle">从主观感觉</text>
  <text class="label" x="950" y="545" text-anchor="middle">变成可验证事实</text>
  <text class="label" x="950" y="580" text-anchor="middle">可复制给团队</text>

  <!-- 底部提示 -->
  <rect class="note" x="120" y="650" width="960" height="70" rx="12"/>
  <text class="label" x="600" y="694" text-anchor="middle">最小闭环：输入 → 执行 → 校验 → 回执（一次成功 ≠ 稳定）</text>
</svg>
