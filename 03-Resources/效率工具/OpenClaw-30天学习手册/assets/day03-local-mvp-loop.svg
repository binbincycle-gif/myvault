<svg width="960" height="1360" viewBox="0 0 960 1360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #fffdf7; }
      .title { font: 700 34px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill: #1f2937; }
      .subtitle { font: 600 22px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill: #334155; }
      .text { font: 18px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill: #334155; }
      .small { font: 16px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill: #475569; }
      .box { fill: #fffefb; stroke: #334155; stroke-width: 3; rx: 24; ry: 24; }
      .soft { fill: #f8fafc; stroke: #64748b; stroke-width: 2.5; rx: 22; ry: 22; }
      .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; rx: 20; ry: 20; }
      .arrow { stroke: #334155; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #64748b; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 7 9; }
    </style>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M1.5,1.5 L11.5,6.5 L1.5,11.5" fill="none" stroke="#334155" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowSoft" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M1.5,1.5 L11.5,6.5 L1.5,11.5" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="1360"/>

  <text class="title" x="64" y="78">Day03 本地启动与最小闭环验证</text>
  <text class="subtitle" x="64" y="116">先跑通一条短链路，再叠加复杂自动化</text>

  <rect class="soft" x="64" y="150" width="832" height="118"/>
  <text class="subtitle" x="96" y="196">验收口径</text>
  <text class="text" x="96" y="232">不是“能打开界面”，而是“输入、执行、回执、验证”连续成立</text>

  <rect class="box" x="66" y="338" width="168" height="126"/>
  <text class="subtitle" x="112" y="382">用户输入</text>
  <text class="small" x="96" y="416">目标清楚</text>
  <text class="small" x="96" y="442">风险可控</text>

  <rect class="box" x="282" y="338" width="168" height="126"/>
  <text class="subtitle" x="328" y="382">会话承接</text>
  <text class="small" x="312" y="416">上下文正确</text>
  <text class="small" x="312" y="442">路径明确</text>

  <rect class="box" x="510" y="338" width="168" height="126"/>
  <text class="subtitle" x="556" y="382">工具执行</text>
  <text class="small" x="540" y="416">先用低风险</text>
  <text class="small" x="540" y="442">结果可读取</text>

  <rect class="box" x="726" y="338" width="168" height="126"/>
  <text class="subtitle" x="772" y="382">结果回执</text>
  <text class="small" x="756" y="416">有证据</text>
  <text class="small" x="756" y="442">可复跑</text>

  <path class="arrow" marker-end="url(#arrow)" d="M234 401 C250 398, 264 398, 282 401"/>
  <path class="arrow" marker-end="url(#arrow)" d="M450 401 C470 398, 490 398, 510 401"/>
  <path class="arrow" marker-end="url(#arrow)" d="M678 401 C694 398, 710 398, 726 401"/>

  <path class="thin" marker-end="url(#arrowSoft)" d="M810 464 C808 520, 694 548, 594 548 C430 548, 250 532, 150 464"/>
  <text class="small" x="370" y="578">复跑 2~3 次，确认不是偶发成功</text>

  <rect class="soft" x="86" y="640" width="788" height="132"/>
  <text class="subtitle" x="118" y="686">推荐验证顺序</text>
  <text class="text" x="118" y="724">状态检查 → 读取本地文件 → 查看工具回执 → 检查证据 → 再复跑</text>
  <text class="small" x="118" y="752">原则：先只读，后写入；先短链路，后复杂链路；先证据，再结论</text>

  <rect class="warn" x="70" y="852" width="246" height="158"/>
  <text class="subtitle" x="108" y="895">卡点 1：入口</text>
  <text class="small" x="98" y="932">服务未就绪</text>
  <text class="small" x="98" y="960">请求无响应</text>
  <text class="small" x="98" y="988">先看运行状态</text>

  <rect class="warn" x="358" y="852" width="246" height="158"/>
  <text class="subtitle" x="396" y="895">卡点 2：会话</text>
  <text class="small" x="386" y="932">上下文错位</text>
  <text class="small" x="386" y="960">工作目录不一致</text>
  <text class="small" x="386" y="988">先确认 session</text>

  <rect class="warn" x="646" y="852" width="246" height="158"/>
  <text class="subtitle" x="684" y="895">卡点 3：工具</text>
  <text class="small" x="674" y="932">权限策略拦截</text>
  <text class="small" x="674" y="960">路径或能力不符</text>
  <text class="small" x="674" y="988">先读错误信息</text>

  <path class="thin" marker-end="url(#arrowSoft)" d="M193 1010 C236 1088, 330 1112, 420 1124"/>
  <path class="thin" marker-end="url(#arrowSoft)" d="M481 1010 C481 1066, 481 1092, 481 1120"/>
  <path class="thin" marker-end="url(#arrowSoft)" d="M769 1010 C724 1088, 632 1112, 542 1124"/>

  <rect class="box" x="222" y="1124" width="516" height="144"/>
  <text class="subtitle" x="272" y="1172">最终目标：证据化交付</text>
  <text class="text" x="272" y="1210">成功：能复查、能复跑、能说明结果</text>
  <text class="text" x="272" y="1242">失败：能定位到入口、会话、工具或权限层</text>

  <text class="small" x="64" y="1320">管理提醒：没有最小闭环，不要直接上高风险、长链路、对外发送类自动化。</text>
</svg>
