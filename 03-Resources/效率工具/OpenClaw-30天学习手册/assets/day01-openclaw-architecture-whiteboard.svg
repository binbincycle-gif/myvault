<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#2b2b2b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .bg { fill:#fffdf7; }
      .box { fill:#fffefb; stroke:#2b2b2b; stroke-width:2.2; stroke-linejoin:round; rx:18; ry:18; }
      .line { fill:none; stroke:#2b2b2b; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .title { font: 700 28px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#1f1f1f; }
      .label { font: 600 22px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#1f1f1f; }
      .note { font: 16px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#444; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="620"/>
  <text class="title" x="480" y="52" text-anchor="middle">OpenClaw 从对话到执行的主链路</text>

  <rect class="box" x="58" y="120" width="170" height="92"/>
  <text class="label" x="143" y="160" text-anchor="middle">用户对话</text>
  <text class="note" x="143" y="188" text-anchor="middle">目标、问题、触发词</text>

  <rect class="box" x="274" y="120" width="170" height="92"/>
  <text class="label" x="359" y="160" text-anchor="middle">Agent 理解</text>
  <text class="note" x="359" y="188" text-anchor="middle">识别意图与上下文</text>

  <rect class="box" x="490" y="120" width="170" height="92"/>
  <text class="label" x="575" y="160" text-anchor="middle">策略决策</text>
  <text class="note" x="575" y="188" text-anchor="middle">直答 or 调工具</text>

  <rect class="box" x="706" y="120" width="170" height="92"/>
  <text class="label" x="791" y="160" text-anchor="middle">工具执行</text>
  <text class="note" x="791" y="188" text-anchor="middle">读写、网页、命令、消息</text>

  <rect class="box" x="706" y="306" width="170" height="92"/>
  <text class="label" x="791" y="346" text-anchor="middle">结果回收</text>
  <text class="note" x="791" y="374" text-anchor="middle">汇总、判断、补步骤</text>

  <rect class="box" x="490" y="306" width="170" height="92"/>
  <text class="label" x="575" y="346" text-anchor="middle">状态与审计</text>
  <text class="note" x="575" y="374" text-anchor="middle">日志、轨迹、可回放</text>

  <rect class="box" x="274" y="306" width="170" height="92"/>
  <text class="label" x="359" y="346" text-anchor="middle">可交付输出</text>
  <text class="note" x="359" y="374" text-anchor="middle">结论、文件、通知</text>

  <rect class="box" x="58" y="306" width="170" height="92"/>
  <text class="label" x="143" y="346" text-anchor="middle">业务闭环</text>
  <text class="note" x="143" y="374" text-anchor="middle">拿结果、继续迭代</text>

  <path class="line" d="M228 166 C244 166, 256 166, 274 166"/>
  <path class="line" d="M444 166 C460 166, 472 166, 490 166"/>
  <path class="line" d="M660 166 C676 166, 688 166, 706 166"/>
  <path class="line" d="M791 212 C791 246, 791 270, 791 306"/>
  <path class="line" d="M706 352 C688 352, 676 352, 660 352"/>
  <path class="line" d="M490 352 C472 352, 460 352, 444 352"/>
  <path class="line" d="M274 352 C256 352, 244 352, 228 352"/>

  <path class="line" d="M575 306 C575 270, 610 244, 706 214"/>
  <text class="note" x="612" y="262">失败可回看，成功可复用</text>

  <text class="note" x="480" y="456" text-anchor="middle">重点不是“会聊天”，而是把目标变成一条可执行、可回溯、可持续优化的链路。</text>
  <text class="note" x="480" y="494" text-anchor="middle">先有对话入口，再有工具动作，最后沉淀为流程和治理能力。</text>
</svg>