<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg{fill:#fffdfa}
      .title{font:700 74px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#111}
      .text{font:700 40px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#111}
      .sub{font:600 31px 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC','Microsoft YaHei',sans-serif;fill:#222}
      .cloud{fill:none;stroke:#4f7fd9;stroke-width:6;stroke-dasharray:10 12}
      .core{fill:none;stroke:#d44b4b;stroke-width:8}
      .runtime{fill:none;stroke:#4f7fd9;stroke-width:7}
      .box{fill:#fff;stroke:#111;stroke-width:6}
      .arr{stroke:#3b6fd0;stroke-width:6.5;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}
      .arr2{stroke:#3b6fd0;stroke-width:5.2;fill:none;marker-end:url(#a);stroke-linecap:round;stroke-linejoin:round}
    </style>
    <marker id="a" markerWidth="6" markerHeight="6" refX="5.2" refY="3" orient="auto" markerUnits="strokeWidth" viewBox="0 0 6 6">
      <path d="M0.6,0.6 L5.2,3 L0.6,5.4" fill="none" stroke="#3b6fd0" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="980"/>
  <text class="title" x="800" y="88" text-anchor="middle">OpenClaw 的系统架构</text>

  <!-- cloud -->
  <path class="cloud" d="M220,180 C250,120 360,120 410,170 C470,120 560,120 620,170 C700,120 810,120 870,180 C950,140 1060,150 1120,210 C1200,180 1320,220 1320,300 C1330,380 1260,430 1180,420 L360,420 C280,430 210,390 200,320 C190,250 220,210 220,180 Z"/>
  <text class="text" x="800" y="250" text-anchor="middle">多通道接入</text>
  <text class="text" x="520" y="330" text-anchor="middle">Feishu</text>
  <text class="text" x="800" y="330" text-anchor="middle">Telegram</text>
  <text class="text" x="1080" y="330" text-anchor="middle">Discord</text>

  <!-- core -->
  <ellipse class="core" cx="800" cy="585" rx="670" ry="200"/>

  <rect class="box" x="230" y="500" width="250" height="170" rx="20"/>
  <rect class="box" x="520" y="500" width="250" height="170" rx="20"/>
  <rect class="box" x="810" y="500" width="250" height="170" rx="20"/>
  <rect class="box" x="1100" y="500" width="250" height="170" rx="20"/>

  <text class="text" x="355" y="575" text-anchor="middle">LLM</text>
  <text class="sub" x="355" y="620" text-anchor="middle">（大脑）</text>

  <text class="text" x="645" y="575" text-anchor="middle">Memory</text>
  <text class="sub" x="645" y="620" text-anchor="middle">（记忆）</text>

  <text class="text" x="935" y="575" text-anchor="middle">Skills</text>
  <text class="sub" x="935" y="620" text-anchor="middle">（技能）</text>

  <text class="text" x="1225" y="575" text-anchor="middle">Cron</text>
  <text class="sub" x="1225" y="620" text-anchor="middle">（自动化）</text>

  <path class="arr" d="M470,585 L520,585"/>
  <path class="arr" d="M760,585 L810,585"/>
  <path class="arr" d="M1050,585 L1100,585"/>

  <path class="arr" d="M530,380 C505,402 430,442 360,498"/>
  <path class="arr" d="M800,380 C780,404 720,444 645,498"/>
  <path class="arr" d="M1060,380 C1045,406 1000,446 935,498"/>
  <path class="arr" d="M1210,380 C1214,414 1220,450 1225,498"/>

