  <text class="text" x="800" y="840" text-anchor="middle">一台完整的电脑（Runtime）</text>
  <text class="text" x="480" y="900" text-anchor="middle">Shell</text>
  <text class="text" x="800" y="900" text-anchor="middle">Browser</text>
  <text class="text" x="1120" y="900" text-anchor="middle">Network</text>

  <path class="arr" d="M355,670 C346,706 362,736 355,766"/>
