<svg width="900" height="1200" viewBox="0 0 900 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L12,7 L2,12" fill="none" stroke="#26364f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0.025 0.045"/>
      </feComponentTransfer>
    </filter>
    <style>
      .bg { fill:#fffdf7; }
      .grain { opacity:0.16; filter:url(#paper); }
      .title { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:34px; fill:#20304a; font-weight:600; }
      .subtitle { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:22px; fill:#526179; }
      .label { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:28px; fill:#20304a; font-weight:600; }
      .small { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:21px; fill:#4d5b73; }
      .tiny { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:18px; fill:#60708a; }
      .box { fill:#fffefa; stroke:#26364f; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .blue { fill:#eef5ff; }
      .green { fill:#eef9f0; }
      .orange { fill:#fff4e2; }
      .red { fill:#fdeef2; }
      .purple { fill:#f2efff; }
      .line { fill:none; stroke:#26364f; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .soft { fill:none; stroke:#6c7a92; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:7 10; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="1200" class="bg"/>
  <rect x="0" y="0" width="900" height="1200" class="grain"/>

  <text x="64" y="74" class="title">Day23｜最小安全规约与审批策略</text>
  <text x="64" y="112" class="subtitle">原则：低风险少打扰，高风险必须看得懂、批得清、追得到</text>

  <rect x="110" y="160" rx="22" ry="22" width="680" height="92" class="box blue"/>
  <text x="154" y="198" class="label">1. 任务进入</text>
  <text x="154" y="230" class="small">自然语言 / 文件 / 网页 / 定时任务先进入同一条判断链</text>

  <path d="M450 252 C450 282,450 292,450 322" class="line"/>

  <rect x="110" y="322" rx="22" ry="22" width="680" height="118" class="box purple"/>
  <text x="154" y="362" class="label">2. 风险分层</text>
  <text x="154" y="396" class="small">L1 只读查询　L2 内部写入　L3 外部动作　L4 系统级动作</text>
  <text x="154" y="424" class="tiny">关键不是“能不能做”，而是“应该用多大摩擦去做”。</text>

  <path d="M450 440 C450 470,450 480,450 510" class="line"/>

  <rect x="70" y="510" rx="22" ry="22" width="330" height="144" class="box green"/>
  <text x="112" y="550" class="label">3A. 低风险直行</text>
  <text x="112" y="586" class="small">读取 / 查询 / 生成内部草稿</text>
  <text x="112" y="618" class="small">限制路径与来源</text>
  <text x="112" y="644" class="tiny">保留日志，不反复打断用户</text>

  <rect x="500" y="510" rx="22" ry="22" width="330" height="144" class="box red"/>
  <text x="542" y="550" class="label">3B. 高风险审批</text>
  <text x="542" y="586" class="small">外发 / 提交 / 命令 / 覆盖</text>
  <text x="542" y="618" class="small">展示动作、目标、风险</text>
  <text x="542" y="644" class="tiny">确认后才继续，拒绝则停止</text>

  <path d="M400 580 C430 580,470 580,500 580" class="soft"/>
  <path d="M235 654 C235 704,320 724,390 746" class="line"/>
  <path d="M665 654 C665 704,580 724,510 746" class="line"/>

  <rect x="110" y="746" rx="22" ry="22" width="680" height="112" class="box orange"/>
  <text x="154" y="788" class="label">4. 受控执行</text>
  <text x="154" y="824" class="small">按授权范围调用工具；不临时扩大权限，不把一次确认泛化成长期放行</text>

  <path d="M450 858 C450 892,450 904,450 936" class="line"/>

  <rect x="110" y="936" rx="22" ry="22" width="680" height="122" class="box blue"/>
  <text x="154" y="978" class="label">5. 审计与回滚闭环</text>
  <text x="154" y="1014" class="small">记录触发人、时间、目标、结果；失败要能熔断，关键变更要能恢复</text>
  <text x="154" y="1044" class="tiny">治理不是挡住 AI，而是让 AI 可以被放心使用。</text>

  <rect x="110" y="1100" rx="18" ry="18" width="680" height="58" fill="#fffefa" stroke="#8b6f2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="145" y="1137" class="small">管理口诀：先分层，再审批；能直行的不折腾，该确认的不省略。</text>
</svg>
