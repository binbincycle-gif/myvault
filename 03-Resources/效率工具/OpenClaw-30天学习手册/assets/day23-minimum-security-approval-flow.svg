<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#2f3b52" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0 0.03 0.05"/>
      </feComponentTransfer>
    </filter>
    <style>
      .bg { fill:#fffdf8; }
      .grain { opacity:0.18; filter:url(#paper); }
      .title { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:34px; fill:#24324a; }
      .label { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:24px; fill:#24324a; }
      .small { font-family:'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',cursive; font-size:20px; fill:#4d5b73; }
      .box { fill:#fffefb; stroke:#2f3b52; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
      .accentA { fill:#eef5ff; }
      .accentB { fill:#edf9f0; }
      .accentC { fill:#fff5e8; }
      .accentD { fill:#fdeff2; }
      .line { fill:none; stroke:#2f3b52; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .dash { fill:none; stroke:#6a7892; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:8 10; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" class="bg"/>
  <rect x="0" y="0" width="1200" height="760" class="grain"/>

  <text x="70" y="70" class="title">Day23｜最小安全规约与审批策略</text>
  <text x="70" y="110" class="small">先分层，再审批；高风险加摩擦，低风险保效率</text>

  <rect x="80" y="170" rx="20" ry="20" width="180" height="86" class="box accentA"/>
  <text x="122" y="205" class="label">任务输入</text>
  <text x="108" y="236" class="small">自然语言 / 文件 / 网页</text>

  <rect x="340" y="160" rx="20" ry="20" width="220" height="106" class="box accentA"/>
  <text x="384" y="198" class="label">风险分层</text>
  <text x="374" y="230" class="small">读 / 内部写 / 外发 / 系统级</text>

  <rect x="660" y="150" rx="20" ry="20" width="210" height="126" class="box accentB"/>
  <text x="704" y="190" class="label">最小规约</text>
  <text x="690" y="223" class="small">来源白名单</text>
  <text x="690" y="249" class="small">工具边界 / 数据边界</text>

  <rect x="950" y="170" rx="20" ry="20" width="170" height="86" class="box accentB"/>
  <text x="987" y="206" class="label">放行判断</text>
  <text x="982" y="236" class="small">是否可直行</text>

  <rect x="150" y="400" rx="22" ry="22" width="220" height="118" class="box accentC"/>
  <text x="196" y="440" class="label">低风险直行</text>
  <text x="186" y="472" class="small">查询 / 读取 / 内部草稿</text>
  <text x="206" y="500" class="small">保留基础日志</text>

  <rect x="490" y="390" rx="22" ry="22" width="220" height="138" class="box accentD"/>
  <text x="536" y="430" class="label">审批节点</text>
  <text x="524" y="462" class="small">展示动作 / 目标 / 风险</text>
  <text x="530" y="490" class="small">用户明确确认后继续</text>

  <rect x="840" y="400" rx="22" ry="22" width="220" height="118" class="box accentB"/>
  <text x="886" y="440" class="label">受控执行</text>
  <text x="874" y="472" class="small">外发 / 提交 / 命令执行</text>
  <text x="894" y="500" class="small">记录结果状态</text>

  <rect x="470" y="620" rx="22" ry="22" width="300" height="90" class="box accentA"/>
  <text x="530" y="660" class="label">审计与回滚闭环</text>
  <text x="508" y="690" class="small">谁触发、做了什么、失败如何收敛</text>

  <path d="M260 213 C295 213, 305 213, 340 213" class="line"/>
  <path d="M560 213 C600 213, 615 213, 660 213" class="line"/>
  <path d="M870 213 C900 213, 918 213, 950 213" class="line"/>

  <path d="M1035 256 C1035 320, 955 350, 950 400" class="line"/>
  <path d="M995 256 C930 320, 720 336, 600 390" class="line"/>
  <path d="M1010 256 C860 310, 420 330, 260 400" class="dash"/>

  <path d="M370 459 C420 459, 440 459, 490 459" class="dash"/>
  <path d="M710 459 C760 459, 780 459, 840 459" class="line"/>
  <path d="M600 528 C600 570, 620 585, 620 620" class="line"/>
  <path d="M950 518 C950 580, 790 590, 700 620" class="line"/>
  <path d="M260 518 C260 585, 420 600, 510 620" class="dash"/>

  <text x="84" y="318" class="small">规则不是写在文档里，</text>
  <text x="84" y="345" class="small">而是嵌进执行链路里。</text>

  <text x="888" y="330" class="small">高风险动作进入审批，</text>
  <text x="888" y="357" class="small">低风险动作减少打扰。</text>
</svg>