<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" font-family="HanziPen SC, Hannotate SC, KaiTi, STKaiti, PingFang SC, sans-serif">
  <rect width="860" height="560" fill="#fcfcfb"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#5b5b5b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .box { fill:#fffdf8; stroke:#4f4f4f; stroke-width:2.2; rx:16; ry:16; }
      .soft { fill:#f7f3ea; stroke:#666; stroke-width:1.8; rx:14; ry:14; }
      .title { font-size:28px; font-weight:700; fill:#2f2f2f; }
      .h { font-size:20px; font-weight:700; fill:#333; }
      .t { font-size:18px; fill:#333; }
      .s { font-size:16px; fill:#555; }
      .line { stroke:#5b5b5b; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
      .loop { stroke:#8c6a3e; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    </style>
  </defs>

  <text x="430" y="42" text-anchor="middle" class="title">Week2，可治理 Skill 的完整闭环</text>

  <rect x="40" y="78" width="230" height="360" class="box"/>
  <text x="155" y="112" text-anchor="middle" class="h">1. 做出能力</text>

  <rect x="66" y="138" width="178" height="60" class="soft"/>
  <text x="155" y="164" text-anchor="middle" class="t">Day08，理解 Skill 机制</text>
  <text x="155" y="186" text-anchor="middle" class="s">知道它为什么值得封装</text>

  <rect x="66" y="224" width="178" height="60" class="soft"/>
  <text x="155" y="250" text-anchor="middle" class="t">Day09，复刻最小 Skill</text>
  <text x="155" y="272" text-anchor="middle" class="s">从概念走到第一次跑通</text>

  <rect x="66" y="310" width="178" height="88" class="soft"/>
  <text x="155" y="336" text-anchor="middle" class="t">核心产出</text>
  <text x="155" y="362" text-anchor="middle" class="s">有清晰边界的能力单元</text>
  <text x="155" y="386" text-anchor="middle" class="s">不再只是一次性脚本</text>

  <rect x="315" y="78" width="230" height="360" class="box"/>
  <text x="430" y="112" text-anchor="middle" class="h">2. 做到稳定</text>

  <rect x="341" y="138" width="178" height="60" class="soft"/>
  <text x="430" y="164" text-anchor="middle" class="t">Day10，Schema 一致性</text>
  <text x="430" y="186" text-anchor="middle" class="s">输入输出可对接、可复用</text>

  <rect x="341" y="224" width="178" height="60" class="soft"/>
  <text x="430" y="250" text-anchor="middle" class="t">Day11，幂等与重试</text>
  <text x="430" y="272" text-anchor="middle" class="s">失败可恢复，重复不失控</text>

  <rect x="341" y="310" width="178" height="88" class="soft"/>
  <text x="430" y="336" text-anchor="middle" class="t">核心产出</text>
  <text x="430" y="362" text-anchor="middle" class="s">真实环境里也能持续执行</text>
  <text x="430" y="386" text-anchor="middle" class="s">不是一碰就碎的自动化</text>

  <rect x="590" y="78" width="230" height="360" class="box"/>
  <text x="705" y="112" text-anchor="middle" class="h">3. 放进治理</text>

  <rect x="616" y="138" width="178" height="60" class="soft"/>
  <text x="705" y="164" text-anchor="middle" class="t">Day12，权限与审批</text>
  <text x="705" y="186" text-anchor="middle" class="s">谁能用，何时要人工把关</text>

  <rect x="616" y="224" width="178" height="60" class="soft"/>
  <text x="705" y="250" text-anchor="middle" class="t">Day13，审计与脱敏</text>
  <text x="705" y="272" text-anchor="middle" class="s">动作可追溯，信息不过界</text>

  <rect x="616" y="310" width="178" height="88" class="soft"/>
  <text x="705" y="336" text-anchor="middle" class="t">核心产出</text>
  <text x="705" y="362" text-anchor="middle" class="s">组织敢用、能扩面、可问责</text>
  <text x="705" y="386" text-anchor="middle" class="s">Skill 才算具备生产价值</text>

  <path d="M270 258 C286 258, 296 258, 309 258" class="line"/>
  <path d="M545 258 C561 258, 571 258, 584 258" class="line"/>

  <rect x="180" y="466" width="500" height="52" class="box"/>
  <text x="430" y="498" text-anchor="middle" class="t">功能封装 → 结构约束 → 稳定执行 → 权限控制 → 审计留痕</text>

  <path d="M705 438 C778 448, 802 496, 742 528 C617 548, 356 548, 228 528 C166 500, 186 454, 256 444" class="loop"/>
  <text x="430" y="548" text-anchor="middle" class="s">上线后继续复盘、修正、扩场景，这才是 Skill 的长期价值</text>
</svg>
