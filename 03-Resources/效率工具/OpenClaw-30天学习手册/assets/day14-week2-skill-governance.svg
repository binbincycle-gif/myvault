<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" font-family="HanziPen SC, Hannotate SC, KaiTi, STKaiti, PingFang SC, sans-serif">
  <!-- 背景 -->
  <rect width="400" height="320" fill="#fafafa"/>
  
  <!-- 标题 -->
  <text x="200" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Week2 Skill 治理全链路</text>
  
  <!-- 开发阶段 -->
  <rect x="20" y="45" width="80" height="30" rx="4" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="65" text-anchor="middle" font-size="11" fill="#1565c0">开发</text>
  
  <!-- Schema -->
  <rect x="20" y="90" width="80" height="30" rx="4" fill="#e8f5e9" fill-opacity="0.7" stroke="#388e3c" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="110" text-anchor="middle" font-size="11" fill="#2e7d32">Schema</text>
  
  <!-- 幂等 -->
  <rect x="20" y="135" width="80" height="30" rx="4" fill="#fff3e0" fill-opacity="0.7" stroke="#f57c00" stroke-width="1.5" stroke-linecap="round"/>
  <text x="60" y="155" text-anchor="middle" font-size="11" fill="#ef6c00">幂等/重试</text>
  
  <!-- 箭头 -->
  <path d="M100 60 L125 60" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M100 105 L125 105" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M100 150 L125 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 治理阶段 -->
  <rect x="140" y="45" width="80" height="30" rx="4" fill="#fce4ec" fill-opacity="0.7" stroke="#c2185b" stroke-width="1.5" stroke-linecap="round"/>
  <text x="180" y="65" text-anchor="middle" font-size="11" fill="#ad1457">权限审批</text>
  
  <!-- 审计 -->
  <rect x="140" y="90" width="80" height="30" rx="4" fill="#f3e5f5" fill-opacity="0.7" stroke="#7b1fa2" stroke-width="1.5" stroke-linecap="round"/>
  <text x="180" y="110" text-anchor="middle" font-size="11" fill="#6a1b9a">审计/脱敏</text>
  
  <!-- 上线 -->
  <rect x="140" y="135" width="80" height="30" rx="4" fill="#e0f7fa" fill-opacity="0.7" stroke="#0097a7" stroke-width="1.5" stroke-linecap="round"/>
  <text x="180" y="155" text-anchor="middle" font-size="11" fill="#00838f">上线</text>
  
  <!-- 箭头 -->
  <path d="M220 60 L245 60" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M220 105 L245 105" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M220 150 L245 150" stroke="#666" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- 运营阶段 -->
  <rect x="260" y="45" width="80" height="30" rx="4" fill="#fff9c4" fill-opacity="0.7" stroke="#fbc02d" stroke-width="1.5" stroke-linecap="round"/>
  <text x="300" y="65" text-anchor="middle" font-size="11" fill="#f9a825">执行</text>
  
  <!-- 监控 -->
  <rect x="260" y="90" width="80" height="30" rx="4" fill="#efebe9" fill-opacity="0.7" stroke="#6d4c41" stroke-width="1.5" stroke-linecap="round"/>
  <text x="300" y="110" text-anchor="middle" font-size="11" fill="#5d4037">监控</text>
  
  <!-- 迭代 -->
  <rect x="260" y="135" width="80" height="30" rx="4" fill="#eceff1" fill-opacity="0.7" stroke="#546e7a" stroke-width="1.5" stroke-linecap="round"/>
  <text x="300" y="155" text-anchor="middle" font-size="11" fill="#455a64">迭代</text>
  
  <!-- 横向箭头 -->
  <path d="M60 180 L60 200" stroke="#666" stroke-width="1.5" fill="none"/>
  <path d="M180 180 L180 200" stroke="#666" stroke-width="1.5" fill="none"/>
  <path d="M300 180 L300 200" stroke="#666" stroke-width="1.5" fill="none"/>
  
  <!-- 循环箭头 -->
  <path d="M300 195 Q360 230 300 270 Q240 230 300 195" stroke="#ff7043" stroke-width="1.5" fill="none" stroke-dasharray="4,2"/>
  <text x="330" y="245" font-size="10" fill="#d84315">持续迭代</text>
  
  <!-- 底部标签 -->
  <rect x="40" y="230" width="60" height="20" rx="3" fill="#e3f2fd" stroke="#1976d2" stroke-width="1"/>
  <text x="70" y="244" text-anchor="middle" font-size="9" fill="#1565c0">编码实现</text>
  
  <rect x="160" y="230" width="60" height="20" rx="3" fill="#fce4ec" stroke="#c2185b" stroke-width="1"/>
  <text x="190" y="244" text-anchor="middle" font-size="9" fill="#ad1457">安全合规</text>
  
  <rect x="280" y="230" width="60" height="20" rx="3" fill="#fff9c4" stroke="#fbc02d" stroke-width="1"/>
  <text x="310" y="244" text-anchor="middle" font-size="9" fill="#f9a825">生产运营</text>
  
  <!-- 关键能力标签 -->
  <text x="60" y="280" font-size="9" fill="#666">Day08 Skill入口</text>
  <text x="180" y="280" font-size="9" fill="#666">Day12 权限/审批</text>
  <text x="300" y="280" font-size="9" fill="#666">Day06 观测</text>
  
  <text x="110" y="280" font-size="9" fill="#666">Day09-10</text>
  <text x="230" y="280" font-size="9" fill="#666">Day13 审计</text>
  
  <!-- 箭头标记 -->
  <defs>
    <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666"/>
    </marker>
  </defs>
</svg>
