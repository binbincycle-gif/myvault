<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
  <style>
    text { font-family: 'HanziPen SC','Hannotate SC','KaiTi','STKaiti','PingFang SC',sans-serif; fill:#1f2937; }
    .box { fill:#fffdf7; stroke:#334155; stroke-width:2.2; rx:18; ry:18; }
    .sub { font-size:18px; fill:#475569; }
    .title { font-size:25px; font-weight:700; }
    .small { font-size:17px; }
    .arrow { stroke:#334155; stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; marker-end:url(#arrow); }
    .warn { fill:#fff7ed; stroke:#f97316; }
    .ok { fill:#f0fdf4; stroke:#22c55e; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6" fill="#334155" />
    </marker>
  </defs>
  <text x="40" y="42" class="title">Skill 版本管理：先稳住老用户，再发布新能力</text>
  <rect x="40" y="80" width="190" height="105" class="box"/>
  <text x="70" y="118" class="title">v1 稳定版</text>
  <text x="70" y="148" class="sub">字段 / 权限 / 输出</text>
  <text x="70" y="172" class="sub">客户正在使用</text>
  <path d="M235 132 C270 128, 285 128, 320 132" class="arrow"/>
  <rect x="325" y="80" width="210" height="105" class="box warn"/>
  <text x="355" y="118" class="title">变更评估</text>
  <text x="355" y="148" class="sub">破坏性 or 兼容性</text>
  <text x="355" y="172" class="sub">灰度 / 回滚 / 通知</text>
  <path d="M540 132 C575 128, 590 128, 625 132" class="arrow"/>
  <rect x="630" y="80" width="230" height="105" class="box ok"/>
  <text x="660" y="118" class="title">v2 发布</text>
  <text x="660" y="148" class="sub">保留旧入口</text>
  <text x="660" y="172" class="sub">新能力逐步放量</text>
  <rect x="125" y="235" width="235" height="78" class="box"/>
  <text x="150" y="268" class="small">兼容：老字段继续可用</text>
  <text x="150" y="294" class="small">默认值：新字段可缺省</text>
  <rect x="415" y="235" width="245" height="78" class="box"/>
  <text x="440" y="268" class="small">灰度：先内部/小客户</text>
  <text x="440" y="294" class="small">回滚：异常能退回 v1</text>
  <path d="M242 235 C250 208, 250 205, 235 185" class="arrow"/>
  <path d="M535 235 C530 208, 545 205, 630 185" class="arrow"/>
</svg>
