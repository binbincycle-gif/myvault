<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="80" font-size="34" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0f172a" font-weight="700">SaaS 功能 ≠ Skill</text>
  <text x="60" y="120" font-size="20" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#475569">页面功能面向“操作”，Skill 面向“结果”与“复用”</text>

  <rect x="70" y="190" rx="20" ry="20" width="450" height="420" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="110" y="250" font-size="30" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#1e293b" font-weight="700">SaaS 功能</text>
  <text x="110" y="310" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">• 面向页面和人工操作</text>
  <text x="110" y="360" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">• 强依赖按钮、流程和界面</text>
  <text x="110" y="410" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">• 用户关心“我点哪里”</text>
  <text x="110" y="460" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">• 适合单次功能完成</text>
  <text x="110" y="510" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">• 不天然适合被多个入口复用</text>

  <rect x="680" y="190" rx="20" ry="20" width="450" height="420" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text x="840" y="250" font-size="30" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#166534" font-weight="700">Skill</text>
  <text x="720" y="310" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">• 面向业务动作与结果</text>
  <text x="720" y="360" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">• 标准化输入 / 输出 / 边界</text>
  <text x="720" y="410" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">• 用户关心“它帮我完成什么”</text>
  <text x="720" y="460" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">• 可被多入口、多角色、多流程调用</text>
  <text x="720" y="510" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">• 更适合沉淀组织经验与编排能力</text>

  <line x1="520" y1="400" x2="680" y2="400" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="548" y="380" font-size="20" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#475569">从功能抽象到能力</text>

  <rect x="140" y="650" rx="14" ry="14" width="920" height="58" fill="#e2e8f0"/>
  <text x="190" y="688" font-size="24" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0f172a" font-weight="700">不要直接把现有页面功能搬成 Skill，而要先判断：它是否是一个稳定、可复用、可治理的业务动作。</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
  </defs>
</svg>
