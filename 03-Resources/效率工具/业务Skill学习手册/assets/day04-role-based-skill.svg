<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="80" font-size="34" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0f172a" font-weight="700">不同角色需要不同 Skill，不是同一能力写一份文档就够了</text>
  <text x="60" y="120" font-size="20" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#475569">品牌、门店、导购的目标不同，所以 Skill 的封装方式、描述方式和输出方式都应不同</text>

  <rect x="90" y="210" rx="20" ry="20" width="280" height="260" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="195" y="255" font-size="28" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#1d4ed8" font-weight="700">品牌</text>
  <text x="120" y="320" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">关注经营洞察</text>
  <text x="120" y="365" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">关注资源优先级</text>
  <text x="120" y="410" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">关注策略与结果</text>

  <rect x="460" y="210" rx="20" ry="20" width="280" height="260" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="565" y="255" font-size="28" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#15803d" font-weight="700">门店</text>
  <text x="490" y="320" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">关注门店经营动作</text>
  <text x="490" y="365" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">关注执行与异常</text>
  <text x="490" y="410" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">关注店长管理效率</text>

  <rect x="830" y="210" rx="20" ry="20" width="280" height="260" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="935" y="255" font-size="28" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#b45309" font-weight="700">导购</text>
  <text x="860" y="320" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">关注今天跟谁</text>
  <text x="860" y="365" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">关注推什么、怎么说</text>
  <text x="860" y="410" font-size="22" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#334155">关注动作转化</text>

  <rect x="140" y="560" rx="24" ry="24" width="920" height="120" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="190" y="620" font-size="28" font-family="Arial, PingFang SC, Microsoft YaHei" fill="#0f172a" font-weight="700">同一底层能力可以复用，但 Skill 的封装、描述和输出必须按角色拆开。</text>

</svg>
